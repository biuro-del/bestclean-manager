<h1 class="welcome">Zdarzenia</h1>
<p class="subwelcome">Lista + edycja wiersza. Domyślnie: od 1. dnia miesiąca do dziś. 50 rekordów na stronę.</p>

<div class="toolbar" aria-label="Filtry">
  <div class="tool">
    <label for="evFrom">Od (Start)</label>
    <input id="evFrom" type="date" />
  </div>

  <div class="tool">
    <label for="evTo">Do (Start)</label>
    <input id="evTo" type="date" />
  </div>

  <div class="tool">
    <label for="evWorker">Pracownik</label>
    <input id="evWorker" type="text" placeholder="np. Marta" />
  </div>

  <div class="tool">
    <label for="evStrefa">Strefa</label>
    <input id="evStrefa" type="text" placeholder="np. TS_biurowiec" />
  </div>

  <div class="tool">
    <label for="evPom">Klient</label>
    <input id="evPom" type="text" list="evPomList" placeholder="np. PSP Racibórz" />
    <datalist id="evPomList"></datalist>
  </div>

  <div class="tool">
    <label for="evRoomId">Kod QR</label>
    <input id="evRoomId" type="text" placeholder="np. BC0007" />
  </div>

  <div class="tool">
    <label for="evStatus">Status</label>
    <select id="evStatus">
      <option value="">(wszystkie)</option>
      <option value="CLOSED">CLOSED</option>
      <option value="RUNNING">RUNNING</option>
      <option value="OPEN">OPEN</option>
    </select>
  </div>

  <div class="tool" style="min-width:240px">
    <label for="evQ">Szukaj</label>
    <input id="evQ" type="text" placeholder="szukaj po tekście..." />
  </div>

  <div class="tool-actions">
    <button class="btn2 secondary" id="evAddBtn" type="button">Dodaj zdarzenie</button>
    <button class="btn2 danger" id="evDeleteSelectedBtn" type="button" disabled>Usuń</button>
    <button class="btn2" id="evExportPdfBtn" type="button">PDF</button>
    <button class="btn2" id="evExportExcelBtn" type="button">Excel</button>
    <button class="btn2" id="evResetBtn" type="button">Odśwież</button>
    <button class="btn2 primary" id="evSearchBtn" type="button">Szukaj</button>
  </div>
</div>

<div class="events-table" aria-label="Tabela zdarzeń">
  <div class="events-head">
    <div class="events-select-col"><input id="evSelectAll" type="checkbox" aria-label="Zaznacz wszystko na stronie" /></div>
    <div>Pracownik</div>
    <div>Klient</div>
    <div>Strefa</div>
    <div>Lokalizacja</div>
    <div>Data</div>
    <div>Start</div>
    <div>Stop</div>
    <div>Czas</div>
    <div title="Komentarz">Komentarz</div>
    <div>Edytował</div>
    <div></div>
  </div>

  <div id="evRows"></div>

  <div class="pager">
    <div class="pager-left">
      <span class="pager-label" id="evPageLabel">Strona 1 / 1</span>
      <span id="evShownLabel">Wyświetlono: -</span>
    </div>
    <div class="pager-right">
      <button class="btn2 pager-btn" id="evPrevBtn" type="button"><-</button>
      <button class="btn2 pager-btn" id="evNextBtn" type="button">-></button>
    </div>
  </div>
</div>

<div class="overlay" id="evEditorOverlay" aria-label="Edytuj zdarzenie" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="logo-block" style="display:inline-flex">
      <img id="evLogo" alt="Cleanzi" style="height:42px;width:auto;" />
    </div>

    <h3 id="evEditorTitle">Edytuj zdarzenie</h3>
    <p class="meta">
      CycleID: <span class="mono" id="evCycleId">-</span>
      | Wiersz: <span class="mono" id="evRowNumber">-</span>
      | Edytowano przez: <b id="evEditedBy">-</b>
    </p>

    <div class="grid">
      <div class="field">
        <label for="evEditWorkerSearch">Pracownik</label>
        <div class="ev-editor-picker">
          <input id="evEditWorkerSearch" type="text" placeholder="Wpisz imie i nazwisko..." autocomplete="off" />
          <select id="evEditWorker" class="ev-editor-picker-list" aria-label="Lista pracownikow">
            <option value="">(wybierz)</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="evEditPomSearch">Klient</label>
        <div class="ev-editor-picker">
          <input id="evEditPomSearch" type="text" placeholder="Wpisz nazwe klienta..." autocomplete="off" />
          <select id="evEditPom" class="ev-editor-picker-list" aria-label="Lista klientow">
            <option value="">(wybierz)</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="evEditStrefaSearch">Strefa</label>
        <div class="ev-editor-picker">
          <input id="evEditStrefaSearch" type="text" placeholder="Wpisz nazwe strefy..." autocomplete="off" />
          <select id="evEditStrefa" class="ev-editor-picker-list" aria-label="Lista stref">
            <option value="">(wybierz)</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="evScannedQr">QR zeskanowany przez pracownika</label>
        <input id="evScannedQr" class="event-scanned-qr" type="text" readonly value="-" />
      </div>

      <div class="field">
        <label for="evEditStart">Start (lokalnie)</label>
        <input id="evEditStart" type="datetime-local" />
      </div>

      <div class="field">
        <label for="evEditStop">Stop (lokalnie)</label>
        <input id="evEditStop" type="datetime-local" />
      </div>
      <div class="field" style="grid-column:1 / -1;">
        <label for="evEditComment">Komentarz pracownika</label>
        <textarea id="evEditComment" rows="3" maxlength="500" placeholder="tylko podgląd komentarza od pracownika" readonly></textarea>
      </div>

    </div>
  <div class="row-actions">
      <div class="left">
        <button class="btn2" id="evStopNowBtn" type="button" title="Ustaw Stop = teraz">Stop = teraz</button>
      </div>

      <div class="right">
        <button class="btn2 danger" id="evCancelBtn" type="button">Anuluj</button>
        <button class="btn2 danger" id="evDeleteBtn" type="button">Usuń</button>
        <button class="btn2 primary" id="evSaveBtn" type="button">Zapisz</button>
      </div>
    </div>
  </div>
</div>
<div class="overlay" id="evCommentOverlay" aria-label="Komentarz" role="dialog" aria-modal="true">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div>
        <div class="modal-title">Komentarz</div>
        <div class="modal-subtitle">Podgląd</div>
      </div>
      <button class="icon-btn" type="button" id="evCommentCloseBtn" aria-label="Zamknij">X</button>
    </div>
    <div class="comment-popup-body" id="evCommentText">-</div>
  </div>
</div>
