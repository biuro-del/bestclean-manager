<h1 class="welcome">Czas pracy pracownika</h1>
<p class="subwelcome">Lista pracownik&#243;w. Kliknij &bdquo;Poka&#380;&rdquo;, aby przej&#347;&#263; do szczeg&#243;&#322;&#243;w.</p>

<div class="toolbar" aria-label="Filtry pracownik&#243;w">
  <div class="tool" style="min-width:260px">
    <label for="wtQ">Szukaj</label>
    <input id="wtQ" type="text" placeholder="np. Rafa&#322; / Marta" />
  </div>

  <div class="tool" style="min-width:220px">
    <label for="wtType">Typ</label>
    <input id="wtType" type="text" placeholder="np. Kierownik" />
  </div>

  <div class="tool-actions">
    <button class="btn2" id="wtRefreshBtn" type="button">Od&#347;wie&#380;</button>
    <button class="btn2 primary" id="wtSearchBtn" type="button">Szukaj</button>
  </div>
</div>

<div class="events-table" aria-label="Tabela pracownik&#243;w">
  <div class="events-head" style="grid-template-columns: 140px 260px 220px 140px;">
    <div>ID</div>
    <div>Imi&#281; i nazwisko</div>
    <div>Typ</div>
    <div></div>
  </div>

  <div id="wtRows"></div>

  <div class="pager">
    <div class="pager-left">
      <span class="pager-label" id="wtPageLabel">Strona 1 / 1</span>
      <span id="wtShownLabel">Wy&#347;wietlono: -</span>
    </div>
    <div class="pager-right">
      <button class="btn2 pager-btn" id="wtPrevBtn" type="button">&#8592;</button>
      <button class="btn2 pager-btn" id="wtNextBtn" type="button">&#8594;</button>
    </div>
  </div>
</div>
