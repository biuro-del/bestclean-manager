<style>
  /* WorkerTimeDetail: kolory i czytelność */
  .time-start{ color:#198754 !important; }
  .time-stop{ color:#dc3545 !important; }
  .work-brutto{ font-weight:400; color:#0d6efd !important; } /* Czas pracy: niebieski */
  .work-bold{ font-weight:400; color:#0d6efd !important; } /* Realny czas pracy (netto): niebieski */
  .time-break{ color:#d4a000 !important; font-weight:700; }

  /* Karta sumy miesiąca */
  #wtdMonthCard{ min-height: unset; padding: 14px; }
  #wtdMonthCard .wtd-month-title{ font-weight: 900; font-size: 12px; color: var(--muted2); letter-spacing: .2px; text-transform: uppercase; }
  #wtdMonthCard .wtd-month-label{ font-weight: 900; font-size: 18px; margin-top: 4px; }
  #wtdMonthCard .wtd-month-range{ margin-top: 2px; font-size: 12px; color: var(--muted2); }

  #wtdMonthCard .wtd-month-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:nowrap; }
  #wtdMonthCard .wtd-month-kpis{ margin-top:0; display:flex; gap:18px; flex-wrap:nowrap; align-items:flex-start; justify-content:center; flex:1; }
  #wtdMonthCard .wtd-month-kpis .wtd-kpi{ min-width:150px; }

  #wtdMonthCard .wtd-kpi{ display:flex; flex-direction: column; gap: 2px; text-align:center; min-width: 150px; }
  #wtdMonthCard .wtd-kpi .lbl{ font-size: 12px; color: var(--muted2); font-weight: 900; }
  #wtdMonthCard .wtd-kpi .val{ font-size: 20px; font-weight: 900; }

  #wtdMonthCard .wtd-month-pick{
    min-width: 220px;
    display:flex;
    flex-direction: column;
    gap: 6px;
    align-items:flex-start;
  }
  #wtdMonthCard .wtd-month-pick label{ font-size: 12px; color: var(--muted2); font-weight: 800; }
  #wtdMonthCard .wtd-month-pick select{
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 10px;
    font-size: 14px;
    background: #fff;
  }

  /* ALERTY czasu pracy (Workday_Log) */
  .wt-alert-level-1{ background: rgba(255,165,0,0.18) !important; }
  .wt-alert-level-2{ background: rgba(255,0,0,0.14) !important; }
  .wt-alert-level-1:hover{ background: rgba(255,165,0,0.26) !important; }
  .wt-alert-level-2:hover{ background: rgba(255,0,0,0.20) !important; }
</style>

<h1 class="welcome" id="wtdTitle">Czas pracy - pracownik</h1>
<p class="subwelcome" id="wtdSub">-</p>

<div class="toolbar" aria-label="Filtry czasu pracy">
  <div class="tool" style="min-width:160px">
    <label for="wtdFrom">Od (data)</label>
    <input id="wtdFrom" type="date" />
  </div>

  <div class="tool" style="min-width:160px">
    <label for="wtdTo">Do (data)</label>
    <input id="wtdTo" type="date" />
  </div>

  <div class="tool-actions">
    <button class="btn2" id="wtdRefreshBtn" type="button">Od&#347;wie&#380;</button>
    <button class="btn2" id="wtdAddDayBtn" type="button" style="display:none;">Dodaj dzie&#324;</button>
    <button class="btn2 primary" id="wtdSearchBtn" type="button">Zastosuj</button>
  </div>
</div>

<!-- Suma miesięczna (brutto / przerwy / netto) + wybór miesiąca -->
<div class="card" id="wtdMonthCard" aria-label="Suma miesi&#261;ca" style="margin-top:14px;">
  <div class="wtd-month-row">
    <div>
      <div class="wtd-month-title">Suma miesi&#261;ca</div>
      <div class="wtd-month-label mono" id="wtdMonthLabel">-</div>
      <div class="wtd-month-range" id="wtdMonthRange">-</div>
    </div>

    <div class="wtd-month-kpis"><div class="wtd-month-pick">
      <label for="wtdMonthPick">Wybierz miesi&#261;c</label>
      <select id="wtdMonthPick"></select>
    </div>

    
      <div class="wtd-kpi">
        <div class="lbl">Czas pracy</div>
        <div class="val mono work-bold" id="wtdMonthWork">00:00:00</div>
      </div>
      <div class="wtd-kpi">
        <div class="lbl">Przerwy</div>
        <div class="val mono time-break" id="wtdMonthBreak">00:00:00</div>
      </div>
      <div class="wtd-kpi">
        <div class="lbl">Realny czas pracy</div>
        <div class="val mono work-bold" id="wtdMonthNet">00:00:00</div>
      </div>

      <div class="wtd-kpi wtd-kpi-download">
        <div class="lbl">&nbsp;</div>
        <button class="btn2" id="wtdDownloadEwidencjaBtn" type="button">Pobierz ewidencj&#281; pracy</button>
      </div>
    </div>
  </div>
</div>

<div class="events-table" aria-label="Czas pracy - podsumowanie dzienne" style="--wtd-grid: 110px minmax(160px,1.6fr) 110px 100px 100px 110px 130px 110px minmax(120px,1fr) 92px;">
  <!-- UWAGA: brak kolumny Klient; grid musi pasować do wierszy w JS -->
  <div class="events-head">
    <div>Data</div>
    <div>Imi&#281;</div>
    <div>Typ</div>
    <div>Start pracy</div>
    <div>Koniec pracy</div>
    <div>Czas pracy</div>
    <div>Realny czas pracy</div>
    <div>Przerwa</div>
    <div>Edytowa&#322;</div>
    <div></div>
  </div>
  <div id="wtdSumRows"></div>
</div>

<div class="pager" style="margin-top:12px; display:flex; align-items:center; justify-content:space-between; gap:12px;">
  <div class="pager-left" style="display:flex; align-items:center; gap:10px;">
    <button class="btn2" id="wtdSumPrevBtn" type="button">&#8249; Poprzednia</button>
    <button class="btn2" id="wtdSumNextBtn" type="button">Nast&#281;pna &#8250;</button>
<span class="muted" id="wtdSumPageLabel">Strona 1 / 1</span>
  </div>
  <div class="pager-right">
    <span class="muted" id="wtdSumShownLabel">Wy&#347;wietlono: 0 &#183; Wszystkie: 0 &#183; Na stron&#281;: 50</span>
  </div>
</div>

<!-- Modal: dodaj/edytuj dzień pracy -->
<div class="overlay" id="wtdDayEditorOverlay" aria-label="Dzie&#324; pracy" role="dialog" aria-modal="true">
  <div class="modal" style="position:relative;">
    <div class="logo-block" style="display:inline-flex">
      <img id="wtdLogo" alt="FIDO iClean" style="height:42px;width:auto;" />
    </div>

    <h3 id="wtdDayTitle">Edycja dnia pracy</h3>

    <div class="grid">
      <div class="field">
        <label for="wtdDayDateInput">Data</label>
        <input id="wtdDayDateInput" type="date" />
      </div>

      <div class="field">
        <label for="wtdDayStartTime">Start pracy (czas)</label>
        <input id="wtdDayStartTime" type="time" step="1" />
      </div>

      <div class="field">
        <label for="wtdDayEndTime">Koniec pracy (czas)</label>
        <input id="wtdDayEndTime" type="time" step="1" />
      </div>

      <div class="field" style="grid-column: 1 / -1;">
        <label for="wtdDayWork">Przepracowano (HH:MM:SS)</label>
        <input id="wtdDayWork" type="text" inputmode="numeric" placeholder="00:00:00" readonly />
      </div>

      <div class="field" style="grid-column: 1 / -1;">
        <label for="wtdDayComment">Komentarz</label>
        <textarea id="wtdDayComment" rows="3" placeholder="Opcjonalnie..."></textarea>
      </div>
    </div>

    <div class="row-actions">
      <div class="right" style="margin-left:auto;">
        <button class="btn2 danger" id="wtdDayCancelBtn" type="button">Zamknij</button>
        <button class="btn2" id="wtdDayAckBtn" type="button" style="display:none; margin-right:8px; background:#fff; border:2px solid rgba(255,165,0,0.6);">Zatwierd&#378; przekroczenie normy</button>
        <button class="btn2 primary" id="wtdDaySaveBtn" type="button">Zapisz</button>
      </div>
    </div>

    <button class="btn2" id="wtdDayEditorClose" type="button" style="position:absolute; top:18px; right:18px; padding:6px 10px; border-radius:14px;">&#215;</button>
  </div>
</div>
