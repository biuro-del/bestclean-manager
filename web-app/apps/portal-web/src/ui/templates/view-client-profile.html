<div class="toolbar cp-filters-card" aria-label="Filtry profilu klienta">
  <div class="tool">
    <label for="cpSearchName">Szukaj</label>
    <input id="cpSearchName" type="text" placeholder="nazwa lub id klienta..." />
  </div>

  <div class="tool">
    <label for="cpSearchCity">Miasto</label>
    <input id="cpSearchCity" type="text" placeholder="np. Raciborz" />
  </div>

  <div class="tool">
    <label for="cpSearchCoordinator">Koordynator</label>
    <input id="cpSearchCoordinator" type="text" placeholder="np. Rafal" />
  </div>

  <div class="tool">
    <label for="cpSearchStatus">Status</label>
    <select id="cpSearchStatus">
      <option value="">(wszystkie)</option>
      <option value="Aktywny">Aktywny</option>
      <option value="Nieaktywny">Nieaktywny</option>
      <option value="Wstrzymany">Wstrzymany</option>
      <option value="Archiwalny">Archiwalny</option>
    </select>
  </div>

  <div class="tool-actions">
    <div class="tool-actions-left">
      <select id="cpPageSize" aria-label="Liczba klientow">
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
      </select>
    </div>
    <div class="tool-actions-right">
      <button class="btn2" id="cpRefreshBtn" type="button">Odswiez</button>
      <button class="btn2 primary" id="cpSearchBtn" type="button">Szukaj</button>
    </div>
  </div>
</div>

<div class="cp-table" aria-label="Tabela profilu klientow">
  <div class="cp-head">
    <div>Klient</div>
    <div>Akcja</div>
  </div>

  <div id="clientProfileBody">
    <div class="cp-row cp-row-empty">
      <div>Ladowanie danych...</div><div></div>
    </div>
  </div>
</div>
