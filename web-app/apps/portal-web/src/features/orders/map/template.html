<div class="orders-map-page">
  <div class="orders-map-shell">
    <section class="orders-map-filters" aria-label="Filtry mapy zleceń">
      <label class="orders-map-filter">
        <span>Data od</span>
        <input id="ordersMapDateFrom" type="date" />
      </label>
      <label class="orders-map-filter">
        <span>Data do</span>
        <input id="ordersMapDateTo" type="date" />
      </label>
      <label class="orders-map-filter">
        <span>Status zlecenia</span>
        <select id="ordersMapStatus">
          <option value="new">Nowe</option>
          <option value="active">W trakcie</option>
          <option value="completed">Zakończone</option>
          <option value="">Wszystkie</option>
        </select>
      </label>
      <label class="orders-map-filter">
        <span>Rodzaj zlecenia</span>
        <select id="ordersMapType">
          <option value="">Wszystkie</option>
          <option value="individual">Zlecenie indywidualne</option>
          <option value="cyclic">Zlecenie cykliczne</option>
          <option value="renovation">Zlecenie poremontowe</option>
          <option value="windows">Mycie okien</option>
          <option value="other">Inne zlecenie</option>
        </select>
      </label>
      <label class="orders-map-filter">
        <span>Pracownicy</span>
        <select id="ordersMapWorker"></select>
      </label>
      <label class="orders-map-check">
        <span>Pracownik</span>
        <input id="ordersMapWorkerOnly" type="checkbox" checked />
      </label>
      <button class="orders-map-apply" id="ordersMapApplyBtn" type="button">OK</button>
    </section>

    <section class="orders-map-search-card" aria-label="Szukaj zlecenia na mapie">
      <label>
        <span>Szukaj</span>
        <div class="orders-map-search-row">
          <input id="ordersMapSearch" type="search" placeholder="Wpisz nazwę, klienta, pracownika albo adres..." autocomplete="off" />
          <button id="ordersMapSearchBtn" type="button" aria-label="Szukaj">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
              <path d="m16.5 16.5 4 4" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
            </svg>
          </button>
        </div>
      </label>
    </section>

    <section class="orders-map-card" aria-label="Mapa zleceń">
      <div id="ordersMapCanvas" class="orders-map-canvas" role="img" aria-label="Mapa zleceń"></div>
      <div id="ordersMapNotice" class="orders-map-notice">Ładowanie mapy...</div>
      <div class="orders-map-counter">
        <span>Zlecenia</span>
        <strong id="ordersMapCount">0</strong>
      </div>
    </section>
  </div>
</div>
