<div>
  <header class="portal-page-hero">
    <div class="portal-page-hero__copy">
      <div class="portal-page-hero__title-row">
        <h1>Audyty</h1>
        <span class="portal-page-hero__badge">Kontrola jakości</span>
      </div>
      <p>Wyszukuj audyty i przygotuj dane do dalszej analizy jakości usług.</p>
    </div>
  </header>

  <div class="toolbar" style="margin-top: 16px;">
    <div class="tool" style="min-width: 360px;">
      <label>WYSZUKIWANIE</label>
      <input id="auditSearch" type="text" placeholder="ID audytu, klient, obiekt, koordynator..." />
    </div>

    <div class="tool" style="min-width: 220px;">
      <label>STATUS</label>
      <select id="auditStatus">
        <option value="">Wszystkie</option>
        <option value="OPEN">OPEN</option>
        <option value="CLOSED">CLOSED</option>
      </select>
    </div>

    <div class="tool-actions">
      <button class="btn2" id="auditRefresh" type="button">Odśwież</button>
    </div>
  </div>

  <div class="card" style="margin-top: 14px;">
    <div class="kpi-label">Wyniki</div>
    <div class="kpi-note" id="auditHint">Na razie dodaliśmy tylko UI. W kolejnym etapie podepniemy pobieranie listy audytów z Google Sheets.</div>
  </div>
</div>
