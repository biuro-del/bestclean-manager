  <section class="reports-screen" id="repBuilder" data-rep-screen="detail" style="display:none;">
    <div class="reports-topbar reports-topbar--detail">
      <button class="reports-back" type="button" id="repBack">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>
        <span id="repBackLabel">Wróć do zestawień</span>
      </button>

      <div class="reports-section-heading">

          <h2 id="repTitle" tabindex="-1">Zestawienie</h2>
          <p id="repSubtitle">Wybierz parametry raportu.</p>
        </div>

    <!-- REPORTS_ZESTAWIENIA -->
    <!-- REPORTS_HISTORIA -->
    <div id="repSoon" style="display:none;">
      <section class="reports-empty-state" aria-labelledby="reportsSoonTitle">
        <span class="reports-empty-state__icon" aria-hidden="true"><i class="ph ph-clipboard-text"></i></span>
        <span class="reports-empty-state__eyebrow">Niedostępny raport</span>
        <h3 id="reportsSoonTitle">Ten raport nie ma jeszcze źródła danych</h3>
