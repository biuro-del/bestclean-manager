<header class="portal-page-hero settings-hero">
  <div class="portal-page-hero__copy">
    <div class="portal-page-hero__title-row">
      <h1>Ustawienia</h1>
      <span class="portal-page-hero__badge">W przygotowaniu</span>
    </div>
    <p>Zarządzaj kontem, organizacją i sposobem działania portalu.</p>
  </div>
</header>

<div class="settings-mobile-navigation">
  <label for="settingsModuleSelect">Obszar ustawień</label>
  <div class="settings-select-wrap">
    <i class="ph ph-sliders-horizontal" aria-hidden="true"></i>
    <select id="settingsModuleSelect" aria-label="Wybierz obszar ustawień">
      <option value="settings">Przegląd ustawień</option>
      <optgroup label="Moje konto">
        <option value="settingsProfile">Profil</option>
        <option value="settingsNotifications">Powiadomienia</option>
        <option value="settingsLanguageApp">Język i aplikacja</option>
        <option value="settingsAccountSecurity">Bezpieczeństwo konta</option>
      </optgroup>
      <optgroup label="Organizacja">
        <option value="settingsOrganizationData">Dane organizacji</option>
        <option value="settingsAlerts">Alerty</option>
        <option value="settingsIntegrations">Integracje</option>
        <option value="settingsBilling">Subskrypcja i rozliczenia</option>
        <option value="settingsDataSecurity">Bezpieczeństwo i dane</option>
      </optgroup>
    </select>
    <i class="ph ph-caret-down settings-select-caret" aria-hidden="true"></i>
  </div>
</div>

<div class="settings-shell" data-settings-shell data-can-edit="false">
  <aside class="settings-sidebar">
    <nav class="settings-navigation" aria-label="Nawigacja ustawień">
      <button class="settings-nav-item" type="button" data-route="settings" data-settings-route="settings">
        <i class="ph ph-squares-four" aria-hidden="true"></i>
        <span>Przegląd</span>
      </button>

      <section class="settings-nav-group" aria-labelledby="settingsGroupAccount">
        <h2 id="settingsGroupAccount">Moje konto</h2>
        <button class="settings-nav-item" type="button" data-route="settingsProfile" data-settings-route="settingsProfile">
          <i class="ph ph-user-circle" aria-hidden="true"></i><span>Profil</span>
        </button>
        <button class="settings-nav-item" type="button" data-route="settingsNotifications" data-settings-route="settingsNotifications">
          <i class="ph ph-bell" aria-hidden="true"></i><span>Powiadomienia</span>
        </button>
        <button class="settings-nav-item" type="button" data-route="settingsLanguageApp" data-settings-route="settingsLanguageApp">
          <i class="ph ph-globe-hemisphere-west" aria-hidden="true"></i><span>Język i aplikacja</span>
        </button>
        <button class="settings-nav-item" type="button" data-route="settingsAccountSecurity" data-settings-route="settingsAccountSecurity">
          <i class="ph ph-lock-key" aria-hidden="true"></i><span>Bezpieczeństwo konta</span>
        </button>
      </section>

      <section class="settings-nav-group" aria-labelledby="settingsGroupOrganization">
        <h2 id="settingsGroupOrganization">Organizacja</h2>
        <button class="settings-nav-item" type="button" data-route="settingsOrganizationData" data-settings-route="settingsOrganizationData">
          <i class="ph ph-buildings" aria-hidden="true"></i><span>Dane organizacji</span>
        </button>
        <button class="settings-nav-item" type="button" data-route="settingsAlerts" data-settings-route="settingsAlerts">
          <i class="ph ph-warning-circle" aria-hidden="true"></i><span>Alerty</span>
        </button>
        <button class="settings-nav-item" type="button" data-route="settingsIntegrations" data-settings-route="settingsIntegrations">
          <i class="ph ph-plugs-connected" aria-hidden="true"></i><span>Integracje</span>
        </button>
        <button class="settings-nav-item" type="button" data-route="settingsBilling" data-settings-route="settingsBilling">
          <i class="ph ph-credit-card" aria-hidden="true"></i><span>Subskrypcja i rozliczenia</span>
        </button>
        <button class="settings-nav-item" type="button" data-route="settingsDataSecurity" data-settings-route="settingsDataSecurity">
          <i class="ph ph-shield-check" aria-hidden="true"></i><span>Bezpieczeństwo i dane</span>
        </button>
      </section>
    </nav>
  </aside>

  <div id="settingsModuleContent" class="settings-content" role="region" aria-label="Zawartość ustawień" aria-live="polite"></div>
</div>
