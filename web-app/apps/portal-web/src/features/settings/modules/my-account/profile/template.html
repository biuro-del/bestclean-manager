<section class="settings-module" aria-labelledby="settingsProfileTitle">
  <header class="settings-module-header">
    <div><p class="settings-eyebrow">Moje konto</p><h2 id="settingsProfileTitle">Profil</h2><p>Podstawowe dane profilu i informacje kontaktowe.</p></div>
    <span class="settings-status">W przygotowaniu</span>
  </header>
  <div class="settings-permission-note"><i class="ph ph-info" aria-hidden="true"></i><span data-settings-permission>Edycja będzie dostępna dla ról OWNER i ADMIN.</span></div>
  <fieldset class="settings-fieldset" disabled>
    <legend>Dane profilu</legend>
    <div class="settings-avatar-row">
      <div class="settings-avatar" aria-hidden="true"><i class="ph ph-user"></i></div>
      <div><strong>Zdjęcie profilowe</strong><p>JPG lub PNG, maksymalnie 5 MB.</p><button class="settings-secondary-button" type="button">Zmień zdjęcie</button></div>
    </div>
    <div class="settings-form-grid">
      <label><span>Imię</span><input type="text" placeholder="Imię" autocomplete="given-name"></label>
      <label><span>Nazwisko</span><input type="text" placeholder="Nazwisko" autocomplete="family-name"></label>
      <label><span>Adres e-mail</span><input type="email" placeholder="uzytkownik@firma.pl" autocomplete="email"></label>
      <label><span>Numer telefonu</span><input type="tel" placeholder="+48 000 000 000" autocomplete="tel"></label>
    </div>
  </fieldset>
</section>
