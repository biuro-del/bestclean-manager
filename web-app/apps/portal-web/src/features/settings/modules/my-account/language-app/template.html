<section class="settings-module" aria-labelledby="settingsLanguageTitle">
  <header class="settings-module-header">
    <div><p class="settings-eyebrow">Moje konto</p><h2 id="settingsLanguageTitle">Język i aplikacja</h2><p>Dostosuj język, formaty regionalne i ekran startowy.</p></div>
    <span class="settings-status">W przygotowaniu</span>
  </header>
  <div class="settings-permission-note"><i class="ph ph-info" aria-hidden="true"></i><span data-settings-permission>Edycja będzie dostępna dla ról OWNER i ADMIN.</span></div>
  <fieldset class="settings-fieldset" disabled>
    <legend>Ustawienia regionalne</legend>
    <div class="settings-form-grid">
      <label><span>Język aplikacji</span><select><option>Polski</option></select></label>
      <label><span>Strefa czasowa</span><select><option>Europe/Warsaw (UTC+02:00)</option></select></label>
      <label><span>Format daty</span><select><option>DD.MM.RRRR</option></select></label>
      <label><span>Format godziny</span><select><option>24-godzinny</option></select></label>
    </div>
  </fieldset>
  <fieldset class="settings-fieldset" disabled>
    <legend>Uruchamianie aplikacji</legend>
    <div class="settings-form-grid settings-form-grid--single">
      <label><span>Ekran startowy</span><select><option>Pulpit</option></select><small>Widok otwierany po zalogowaniu do portalu.</small></label>
    </div>
  </fieldset>
</section>
