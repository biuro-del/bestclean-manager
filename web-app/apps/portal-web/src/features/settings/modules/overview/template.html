<section class="settings-module settings-overview" aria-labelledby="settingsOverviewTitle">
  <header class="settings-module-header">
    <div>
      <p class="settings-eyebrow">Centrum ustawień</p>
      <h2 id="settingsOverviewTitle">Przegląd ustawień</h2>
      <p>Wybierz obszar, który chcesz skonfigurować. Dostępne ustawienia rozwijamy etapami.</p>
    </div>
    <span class="settings-status"><i class="ph ph-hammer" aria-hidden="true"></i> W przygotowaniu</span>
  </header>

  <section class="settings-overview-group" aria-labelledby="settingsOverviewAccount">
    <div class="settings-overview-group__heading">
      <div class="settings-group-icon"><i class="ph ph-user" aria-hidden="true"></i></div>
      <div><h3 id="settingsOverviewAccount">Moje konto</h3><p>Preferencje i bezpieczeństwo Twojego konta.</p></div>
    </div>
    <div class="settings-card-grid">
      <button class="settings-module-card" type="button" data-route="settingsProfile">
        <i class="ph ph-user-circle" aria-hidden="true"></i><span><strong>Profil</strong><small>Dane i informacje kontaktowe.</small></span><i class="ph ph-arrow-right" aria-hidden="true"></i>
      </button>
      <button class="settings-module-card" type="button" data-route="settingsNotifications">
        <i class="ph ph-bell" aria-hidden="true"></i><span><strong>Powiadomienia</strong><small>Kanały, typy i godziny ciszy.</small></span><i class="ph ph-arrow-right" aria-hidden="true"></i>
      </button>
      <button class="settings-module-card" type="button" data-route="settingsLanguageApp">
        <i class="ph ph-globe-hemisphere-west" aria-hidden="true"></i><span><strong>Język i aplikacja</strong><small>Formaty i ekran startowy.</small></span><i class="ph ph-arrow-right" aria-hidden="true"></i>
      </button>
      <button class="settings-module-card" type="button" data-route="settingsAccountSecurity">
        <i class="ph ph-lock-key" aria-hidden="true"></i><span><strong>Bezpieczeństwo konta</strong><small>Hasło, MFA i aktywne sesje.</small></span><i class="ph ph-arrow-right" aria-hidden="true"></i>
      </button>
    </div>
  </section>

  <section class="settings-overview-group" aria-labelledby="settingsOverviewOrganization">
    <div class="settings-overview-group__heading">
      <div class="settings-group-icon settings-group-icon--organization"><i class="ph ph-buildings" aria-hidden="true"></i></div>
      <div><h3 id="settingsOverviewOrganization">Organizacja</h3><p>Konfiguracja wspólna dla całej organizacji.</p></div>
    </div>
    <div class="settings-card-grid">
      <button class="settings-module-card" type="button" data-route="settingsOrganizationData">
        <i class="ph ph-buildings" aria-hidden="true"></i><span><strong>Dane organizacji</strong><small>Dane rejestrowe i kontakt.</small></span><i class="ph ph-arrow-right" aria-hidden="true"></i>
      </button>
      <button class="settings-module-card" type="button" data-route="settingsAlerts">
        <i class="ph ph-warning-circle" aria-hidden="true"></i><span><strong>Alerty</strong><small>Reguły, odbiorcy i kanały.</small></span><i class="ph ph-arrow-right" aria-hidden="true"></i>
      </button>
      <button class="settings-module-card" type="button" data-route="settingsIntegrations">
        <i class="ph ph-plugs-connected" aria-hidden="true"></i><span><strong>Integracje</strong><small>Połączenia, API i webhooki.</small></span><i class="ph ph-arrow-right" aria-hidden="true"></i>
      </button>
      <button class="settings-module-card" type="button" data-route="settingsBilling">
        <i class="ph ph-credit-card" aria-hidden="true"></i><span><strong>Subskrypcja i rozliczenia</strong><small>Plan i dane billingowe.</small></span><i class="ph ph-arrow-right" aria-hidden="true"></i>
      </button>
      <button class="settings-module-card" type="button" data-route="settingsDataSecurity">
        <i class="ph ph-shield-check" aria-hidden="true"></i><span><strong>Bezpieczeństwo i dane</strong><small>Retencja, eksport i dostęp.</small></span><i class="ph ph-arrow-right" aria-hidden="true"></i>
      </button>
    </div>
  </section>
</section>
