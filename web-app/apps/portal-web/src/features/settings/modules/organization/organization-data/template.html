<section class="settings-module" aria-labelledby="settingsOrganizationTitle">
  <header class="settings-module-header">
    <div><p class="settings-eyebrow">Organizacja</p><h2 id="settingsOrganizationTitle">Dane organizacji</h2><p>Informacje rejestrowe, kontaktowe i adresowe organizacji.</p></div>
    <span class="settings-status">W przygotowaniu</span>
  </header>
  <div class="settings-permission-note"><i class="ph ph-info" aria-hidden="true"></i><span data-settings-permission>Edycja będzie dostępna dla ról OWNER i ADMIN.</span></div>
  <fieldset class="settings-fieldset" disabled>
    <legend>Dane podstawowe</legend>
    <div class="settings-form-grid">
      <label class="settings-field-wide"><span>Nazwa organizacji</span><input type="text" placeholder="Nazwa organizacji"></label>
      <label><span>NIP</span><input type="text" inputmode="numeric" placeholder="0000000000"></label>
      <label><span>Telefon kontaktowy</span><input type="tel" placeholder="+48 000 000 000"></label>
      <label class="settings-field-wide"><span>Adres e-mail</span><input type="email" placeholder="kontakt@firma.pl"></label>
    </div>
  </fieldset>
  <fieldset class="settings-fieldset" disabled>
    <legend>Adres</legend>
    <div class="settings-form-grid">
      <label class="settings-field-wide"><span>Ulica i numer</span><input type="text" placeholder="Ulica 1"></label>
      <label><span>Kod pocztowy</span><input type="text" placeholder="00-000"></label>
      <label><span>Miejscowość</span><input type="text" placeholder="Miejscowość"></label>
      <label><span>Kraj</span><select><option>Polska</option></select></label>
    </div>
  </fieldset>
</section>
