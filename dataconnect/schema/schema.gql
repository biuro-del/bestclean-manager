# dataconnect/schema/schema.gql
# Best Clean — Multi-tenant schema (organizations) + membership access
# Change: Zone field `id` renamed to `ZoneId` (DB column still `id`)
# Includes: core tables + checklists + client_ind

type Organization @table(
  name: "organizations",
  singular: "organization",
  plural: "organizations",
  key: "orgId"
) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  name: String! @col(name: "name", dataType: "varchar(120)")
  status: String @col(name: "status", dataType: "varchar(30)")
  onboardingStatus: String @col(name: "onboarding_status", dataType: "varchar(30)")
  ownerUid: String @col(name: "owner_uid", dataType: "varchar(128)")
  ownerWorkerId: String @col(name: "owner_worker_id", dataType: "varchar(128)")
  deletedAt: Timestamp @col(name: "deleted_at")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
}

type OrganizationMember @table(
  name: "organization_member",
  singular: "organizationMember",
  plural: "organizationMembers",
  key: ["orgId", "uid"]
)
@index(name: "organization_member_uid_org_lookup_idx", fields: ["uid", "orgId"]) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")

  uid: String! @col(name: "uid", dataType: "varchar(128)")
  role: String! @col(name: "role", dataType: "varchar(30)") # ADMIN / MANAGER / WORKER
  workerId: String @col(name: "worker_id", dataType: "varchar(128)")
  status: String @col(name: "status", dataType: "varchar(30)")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
}

type OrganizationProfile @table(
  name: "organization_profile",
  singular: "organizationProfile",
  plural: "organizationProfiles",
  key: "orgId"
) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")
  nip: String @col(name: "nip", dataType: "varchar(10)")
  regon: String @col(name: "regon", dataType: "varchar(14)")
  legalName: String @col(name: "legal_name", dataType: "varchar(300)")
  registeredAddress: String @col(name: "registered_address")
  street: String @col(name: "street", dataType: "varchar(180)")
  buildingNumber: String @col(name: "building_number", dataType: "varchar(40)")
  unitNumber: String @col(name: "unit_number", dataType: "varchar(40)")
  postalCode: String @col(name: "postal_code", dataType: "varchar(12)")
  city: String @col(name: "city", dataType: "varchar(120)")
  countryCode: String! @col(name: "country_code", dataType: "varchar(2)") @default(value: "PL")
  ownerFullName: String @col(name: "owner_full_name", dataType: "varchar(200)")
  billingName: String @col(name: "billing_name", dataType: "varchar(300)")
  billingNip: String @col(name: "billing_nip", dataType: "varchar(10)")
  billingAddress: String @col(name: "billing_address")
  billingPostalCode: String @col(name: "billing_postal_code", dataType: "varchar(12)")
  billingCity: String @col(name: "billing_city", dataType: "varchar(120)")
  billingCountryCode: String! @col(name: "billing_country_code", dataType: "varchar(2)") @default(value: "PL")
  billingEmail: String @col(name: "billing_email", dataType: "varchar(160)")
  registryProvider: String @col(name: "registry_provider", dataType: "varchar(40)")
  registryFetchedAt: Timestamp @col(name: "registry_fetched_at")
  version: Int! @col(name: "version") @default(value: 0)
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
  updatedByUid: String @col(name: "updated_by_uid", dataType: "varchar(128)")
}

type OrganizationSubscription @table(
  name: "organization_subscription",
  singular: "organizationSubscription",
  plural: "organizationSubscriptions",
  key: "orgId"
) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")
  planCode: String @col(name: "plan_code", dataType: "varchar(30)")
  status: String @col(name: "status", dataType: "varchar(30)")
  trialStartedAt: Timestamp @col(name: "trial_started_at")
  trialEndsAt: Timestamp @col(name: "trial_ends_at")
  currentPeriodStartsAt: Timestamp @col(name: "current_period_starts_at")
  currentPeriodEndsAt: Timestamp @col(name: "current_period_ends_at")
  activatedAt: Timestamp @col(name: "activated_at")
  canceledAt: Timestamp @col(name: "canceled_at")
  providerCode: String @col(name: "provider_code", dataType: "varchar(40)")
  providerSubscriptionId: String @col(name: "provider_subscription_id", dataType: "varchar(255)")
  createdAt: Timestamp @col(name: "created_at")
  updatedAt: Timestamp @col(name: "updated_at")
  version: Int! @col(name: "version") @default(value: 0)
}

type Worker @table(
  name: "worker",
  singular: "worker",
  plural: "workers",
  key: ["orgId", "login"]
) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")

  login: String! @col(name: "login", dataType: "varchar(80)")
  workerId: String @col(name: "worker_id", dataType: "varchar(128)")
  workerName: String @col(name: "full_name")

  # Login email do aplikacji: np. franosz@bestclean.pl
  loginEmail: String @col(name: "login_email", dataType: "varchar(160)")

  # UID z Firebase Auth
  authUid: String @col(name: "auth_uid", dataType: "varchar(128)")

  # Rola pracownika: WORKER/COORD/MANAGER/ADMIN
  role: String @col(name: "role", dataType: "varchar(32)")

  active: Boolean @col(name: "active")
  status: String @col(name: "status", dataType: "varchar(30)")
  email: String @col(name: "email")
  phone: String @col(name: "phone")
  phoneNormalized: String @col(name: "phone_normalized", dataType: "varchar(40)")
  photoUrl: String @col(name: "photo_url")
  workerType: String @col(name: "worker_type", dataType: "varchar(40)")

  createdAt: Timestamp @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp @col(name: "updated_at") @default(expr: "request.time")
  edit: String @col(name: "edit")
}

type WorkerIdReservation @table(
  name: "worker_id_reservation",
  singular: "workerIdReservation",
  plural: "workerIdReservations",
  key: ["orgId", "workerNumber"]
)
@index(name: "worker_id_reservation_org_worker_id_idx", fields: ["orgId", "workerId"]) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")
  workerNumber: Int! @col(name: "worker_number")
  workerId: String! @col(name: "worker_id", dataType: "varchar(128)")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  createdByUid: String @col(name: "created_by_uid", dataType: "varchar(128)")
}


type Client @table(
  name: "client",
  singular: "client",
  plural: "clients",
  key: ["orgId", "clientId"]
) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")

  clientId: String! @col(name: "client_id", dataType: "varchar(64)")
  name: String @col(name: "name")
  nip: String @col(name: "nip")
  city: String @col(name: "city")
  address: String @col(name: "address")
  contact: String @col(name: "contact")
  status: String @col(name: "status")
  clientType: String @col(name: "client_type", dataType: "varchar(24)")
  coordinator: String @col(name: "coordinator")
  serviceFrequency: String @col(name: "service_frequency")
  assignees: String @col(name: "assignees")
  chemistry: String @col(name: "chemistry")
  equipment: String @col(name: "equipment")
  clientInfo: String @col(name: "client_info")

  # Dane podstawowe profilu klienta
  objectType: String @col(name: "object_type")
  cooperationStartAt: Timestamp @col(name: "cooperation_start_at")
  cooperationEndAt: Timestamp @col(name: "cooperation_end_at")

  # Koordynacja i kontakt
  contactPerson: String @col(name: "contact_person")
  phone: String @col(name: "phone")
  email: String @col(name: "email")
  emergencyContact: String @col(name: "emergency_contact")
  contactPosition: String @col(name: "contact_position")

  # Lokalizacja i dostep
  postalCode: String @col(name: "postal_code")
  accessHours: String @col(name: "access_hours")
  accessMethod: String @col(name: "access_method")
  serviceEntry: String @col(name: "service_entry")

  # Warunki obslugi
  serviceType: String @col(name: "service_type")
  serviceDays: String @col(name: "service_days")
  preferredHours: String @col(name: "preferred_hours")
  workMode: String @col(name: "work_mode")
  sla: String @col(name: "sla")
  rbhAmount: Float @col(name: "rbh_amount")

  # Informacje operacyjne
  requiredPermissions: String @col(name: "required_permissions")
  bhpRequirements: String @col(name: "bhp_requirements")
  workRestrictions: String @col(name: "work_restrictions")
  excludedZones: String @col(name: "excluded_zones")
  operationalRisks: String @col(name: "operational_risks")
  specialInstructions: String @col(name: "special_instructions")

  # Chemia i sprzet
  specialEquipment: String @col(name: "special_equipment")
  storagePlace: String @col(name: "storage_place")
  backroomAccess: String @col(name: "backroom_access")
  technicalNotes: String @col(name: "technical_notes")

  # Notatki i timeline
  internalNotes: String @col(name: "internal_notes")
  coordinatorChangedAt: Timestamp @col(name: "coordinator_changed_at")
  lastExecutionAt: Timestamp @col(name: "last_execution_at")
  lastWorkerAssignmentAt: Timestamp @col(name: "last_worker_assignment_at")
  createdAt: Timestamp @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp @col(name: "updated_at") @default(expr: "request.time")
}

type Zone @table(
  name: "zone",
  singular: "zone",
  plural: "zones",
  key: ["orgId", "zoneId"]
) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")

  # RENAMED FIELD: was `id`, now `ZoneId` (DB column stays `id`)
  zoneId: String! @col(name: "id", dataType: "varchar(64)")

  clientId: String @col(name: "client_id", dataType: "varchar(64)")
  client: Client @ref(fields: ["orgId", "clientId"], references: ["orgId", "clientId"])

  zone: String @col(name: "zone")
  function: String @col(name: "function")
  requiredVisit: Boolean! @col(name: "required_visit") @default(value: false)
  editedBy: String @col(name: "edited_by")
  date: Timestamp @col(name: "date")
  location: String @col(name: "location")
}

type Storage @table(
  name: "storage",
  singular: "storage",
  plural: "storages",
  # Use productIndex as the key so client inventory can reference it directly.
  key: ["orgId", "productIndex"]
) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")

  productIndex: String! @col(name: "product_index", dataType: "varchar(64)")
  productId: String! @col(name: "product_id", dataType: "varchar(64)")

  name: String! @col(name: "name")
  productType: String! @col(name: "product_type")

  quantity: Int! @col(name: "quantity")
  quantityMin: Int! @col(name: "quantity_min")
  quantityMax: Int @col(name: "quantity_max")

  description: String @col(name: "product_description")
  qrCode: String @col(name: "qrcode")
}

type ClientStorage @table(
  name: "client_storage",
  singular: "clientStorage",
  plural: "clientStorages",
  key: ["orgId", "clientId", "productIndex"]
) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")

  clientId: String! @col(name: "client_id", dataType: "varchar(64)")
  client: Client! @ref(fields: ["orgId", "clientId"], references: ["orgId", "clientId"])

  productIndex: String! @col(name: "product_index", dataType: "varchar(64)")
  storage: Storage! @ref(fields: ["orgId", "productIndex"], references: ["orgId", "productIndex"])

  name: String! @col(name: "name")
  productType: String! @col(name: "product_type")

  quantity: Int! @col(name: "quantity")
  quantityMin: Int! @col(name: "quantity_min")
  quantityMax: Int @col(name: "quantity_max")

  qrCode: String @col(name: "qrcode")
}

type IndividualClientJob @table(
  name: "individual_job",
  singular: "individualClientJob",
  plural: "individualClientJobs",
  key: ["orgId", "clientIndId"]
) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")

  clientIndId: String! @col(name: "client_ind_id", dataType: "varchar(64)")
  date: Timestamp @col(name: "date")
  name: String @col(name: "name")
  nip: String @col(name: "nip")
  city: String @col(name: "city")
  address: String @col(name: "address")
  contact: String @col(name: "contact")
  clientInfo: String @col(name: "client_info")
  qrCode: String @col(name: "qr_code")
}

type Task @table(
  name: "task",
  singular: "task",
  plural: "tasks",
  key: ["orgId", "idTask"]
)
@index(name: "task_org_date_idx", fields: ["orgId", "dateYmd", "startTime", "idTask"])
@index(name: "task_org_updated_idx", fields: ["orgId", "updatedAt"], order: [ASC, DESC])
@index(name: "task_org_worker_idx", fields: ["orgId", "workerId"]) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")

  idTask: String! @col(name: "id_task", dataType: "varchar(180)")
  lifecycleStatus: String! @col(name: "lifecycle_status", dataType: "varchar(20)") @default(value: "ACTIVE")
  cancelledAt: Timestamp @col(name: "cancelled_at")
  archivedAt: Timestamp @col(name: "archived_at")

  dateYmd: String @col(name: "date_ymd", dataType: "varchar(10)")
  startTime: String @col(name: "start_time", dataType: "varchar(5)")
  endDateYmd: String @col(name: "end_date_ymd", dataType: "varchar(10)")
  endTime: String @col(name: "end_time", dataType: "varchar(5)")
  scheduleMode: String @col(name: "schedule_mode", dataType: "varchar(32)")

  accessStartTime: String @col(name: "access_start_time", dataType: "varchar(5)")
  accessEndTime: String @col(name: "access_end_time", dataType: "varchar(5)")
  accessWindows: String @col(name: "access_windows")

  requiredWorkMinutes: Int @col(name: "required_work_minutes")
  requiredPeople: Int @col(name: "required_people")
  workAllocations: String @col(name: "work_allocations")

  workerId: String @col(name: "worker_id", dataType: "varchar(128)")
  workerIds: String @col(name: "worker_ids")
  workerLabel: String @col(name: "worker_label")
  workerName: String @col(name: "worker_name")
  workerLogin: String @col(name: "worker_login", dataType: "varchar(80)")

  clientId: String @col(name: "client_id", dataType: "varchar(64)")
  client: Client @ref(fields: ["orgId", "clientId"], references: ["orgId", "clientId"])
  clientLabel: String @col(name: "client_label")
  clientName: String @col(name: "client_name")
  nip: String @col(name: "nip")
  street: String @col(name: "street")
  city: String @col(name: "city")
  postCode: String @col(name: "post_code")
  addressLabel: String @col(name: "address_label")
  executionAddressLabel: String @col(name: "execution_address_label")
  lat: Float @col(name: "lat")
  lng: Float @col(name: "lng")

  zoneId: String @col(name: "zone_id", dataType: "varchar(64)")
  zone: Zone @ref(fields: ["orgId", "zoneId"], references: ["orgId", "zoneId"])
  zoneLabel: String @col(name: "zone_label")

  repeatPreset: String @col(name: "repeat_preset", dataType: "varchar(32)")
  repeatEvery: Int @col(name: "repeat_every")
  repeatUnit: String @col(name: "repeat_unit", dataType: "varchar(16)")
  repeatWeekdays: String @col(name: "repeat_weekdays")
  weeklyScheduleRules: String @col(name: "weekly_schedule_rules")

  title: String @col(name: "title")
  type: String @col(name: "type", dataType: "varchar(40)")
  price: Float @col(name: "price")
  description: String @col(name: "description")
  workerComment: String @col(name: "worker_comment")
  supplies: String @col(name: "supplies")
  objectPlanTasks: String @col(name: "object_plan_tasks")
  allowExtendedWork: Boolean @col(name: "allow_extended_work")

  createdByUid: String @col(name: "created_by_uid", dataType: "varchar(128)")
  updatedByUid: String @col(name: "updated_by_uid", dataType: "varchar(128)")
  createdAt: Timestamp @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp @col(name: "updated_at") @default(expr: "request.time")
}

type Workday @table(
  name: "workday",
  singular: "workday",
  plural: "workdays",
  key: ["orgId", "workdayId"]
)
@index(name: "workday_org_start_idx", fields: ["orgId", "startAt"], order: [ASC, DESC])
@index(name: "workday_org_updated_idx", fields: ["orgId", "updatedAt"], order: [ASC, DESC])
@index(name: "workday_org_updated_id_idx", fields: ["orgId", "updatedAt", "workdayId"], order: [ASC, DESC, DESC])
@index(name: "workday_org_worker_start_idx", fields: ["orgId", "workerLogin", "startAt"])
@index(name: "workday_org_room_start_idx", fields: ["orgId", "utilityRoomId", "startAt"])
@index(name: "workday_org_status_start_idx", fields: ["orgId", "status", "startAt"]) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")

  workdayId: String! @col(name: "workday_id", dataType: "varchar(64)")

  workerLogin: String! @col(name: "worker_login", dataType: "varchar(80)")
  workerName: String @col(name: "worker_name")
  worker: Worker! @ref(fields: ["orgId", "workerLogin"], references: ["orgId", "login"])

  utilityRoomId: String @col(name: "utility_room_id")

  startAt: Timestamp @col(name: "start_at")
  endScanAt: Timestamp @col(name: "end_scan_at")
  autoCloseAt: Timestamp @col(name: "auto_close_at")
  endAt: Timestamp @col(name: "end_at")
  businessDateYmd: String @col(name: "business_date_ymd", dataType: "varchar(10)")

  durationSec: Int @col(name: "duration_sec")
  status: String @col(name: "status")
  deviceId: String @col(name: "device_id")

  gps: String @col(name: "gps", dataType: "varchar(255)")

  startEventId: String @col(name: "start_event_id")
  endEventId: String @col(name: "end_event_id")

  createdAt: Timestamp @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp @col(name: "updated_at") @default(expr: "request.time")

  pauseTotalSec: Int @col(name: "pause_total_sec")
  pauseOpenId: String @col(name: "pause_open_id")
  pauseOpenAt: Timestamp @col(name: "pause_open_at")

  startObject: String @col(name: "start_object")
  stopObject: String @col(name: "stop_object")

  wtAlertAck: Boolean @col(name: "wt_alert_ack")
  wtAlertAckAt: Timestamp @col(name: "wt_alert_ack_at")
  wtAlertAckBy: String @col(name: "wt_alert_ack_by")

  updatedBy: String @col(name: "updated_by")
  comment: String @col(name: "comment")
}

type WorkdayReconciliationAudit @table(
  name: "workday_reconciliation_audit",
  singular: "workdayReconciliationAudit",
  plural: "workdayReconciliationAudits",
  key: ["orgId", "auditId"]
) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")

  auditId: String! @col(name: "audit_id", dataType: "varchar(64)")
  workdayId: String! @col(name: "workday_id", dataType: "varchar(64)")
  idempotencyKey: String! @col(name: "idempotency_key", dataType: "varchar(128)")
  requestHash: String! @col(name: "request_hash", dataType: "varchar(64)")
  action: String! @col(name: "action", dataType: "varchar(32)")
  reason: String! @col(name: "reason")
  actorUid: String! @col(name: "actor_uid", dataType: "varchar(128)")
  beforeSnapshot: String! @col(name: "before_snapshot")
  afterSnapshot: String! @col(name: "after_snapshot")
  responseSnapshot: String! @col(name: "response_snapshot")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
}

type WorkdayPause @table(
  name: "workday_pause",
  singular: "workdayPause",
  plural: "workdayPauses",
  key: ["orgId", "pauseId"]
) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")

  pauseId: String! @col(name: "pause_id", dataType: "varchar(64)")

  workdayId: String! @col(name: "workday_id", dataType: "varchar(64)")
  workday: Workday! @ref(fields: ["orgId", "workdayId"], references: ["orgId", "workdayId"])

  workerLogin: String @col(name: "worker_login", dataType: "varchar(80)")
  workerName: String @col(name: "worker_name")
  deviceId: String @col(name: "device_id")
  pauseEventId: String @col(name: "pause_event_id")

  startAt: Timestamp @col(name: "start_at")
  stopAt: Timestamp @col(name: "stop_at")
  durationSec: Int @col(name: "duration_sec")
  status: String @col(name: "status")

  createdAt: Timestamp @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp @col(name: "updated_at") @default(expr: "request.time")
}

type BackupCycle @table(
  name: "backup_cycle",
  singular: "backupCycle",
  plural: "backupCycles",
  key: ["orgId", "cycleId"]
)
