type CheckListDef @table(
  name: "checklist_def",
  singular: "checkListDef",
  plural: "checkListDefs",
  key: ["orgId", "clientId", "dataObject", "qrId", "taskId"]
) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")

  clientId: String! @col(name: "client_id", dataType: "varchar(64)")
  client: Client! @ref(fields: ["orgId", "clientId"], references: ["orgId", "clientId"])

  dataObject: String! @col(name: "data_object")
  qrId: String! @col(name: "qr_id", dataType: "varchar(80)")
  taskId: String! @col(name: "task_id", dataType: "varchar(80)")

  taskName: String @col(name: "task_name")
  required: Boolean @col(name: "required")
  sortOrder: Int @col(name: "sort_order")
  active: Boolean @col(name: "active")


  performedAt: Timestamp @col(name: "performed_at")
  updatedAt: Timestamp @col(name: "updated_at")
  updatedBy: String @col(name: "updated_by")
}

type CheckListExtra @table(
  name: "checklist_extra",
  singular: "checkListExtra",
  plural: "checkListExtras",
  key: ["orgId", "extraId"]
) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")

  extraId: String! @col(name: "extra_id", dataType: "varchar(80)")

  clientId: String @col(name: "client_id", dataType: "varchar(64)")
  client: Client @ref(fields: ["orgId", "clientId"], references: ["orgId", "clientId"])

  dataObject: String @col(name: "data_object")
  qrId: String @col(name: "qr_id", dataType: "varchar(80)")
  taskName: String @col(name: "task_name")
  required: Boolean @col(name: "required")
  priority: String @col(name: "priority")
  status: String @col(name: "status")

  createdAt: Timestamp @col(name: "created_at")
  createdBy: String @col(name: "created_by")
  closedAt: Timestamp @col(name: "closed_at")
  performedAt: Timestamp @col(name: "performed_at")
  closedBy: String @col(name: "closed_by")
  notDoneReason: String @col(name: "not_done_reason")
}

type CheckListLog @table(
  name: "checklist_log",
  singular: "checkListLog",
  plural: "checkListLogs",
