# dataconnect/schema/schema.gql
# Best Clean — Multi-tenant schema (organizations) + membership access
# Change: Zone field `id` renamed to `ZoneId` (DB column still `id`)
# Includes: active core tables + registration and SaaS

type Organization @table(
  name: "organizations",
  singular: "organization",
  plural: "organizations",
  key: "orgId"
) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  name: String! @col(name: "name", dataType: "varchar(120)")
  # ONBOARDING / TRIAL / ACTIVE / PAST_DUE / SUSPENDED /
  # DELETION_SCHEDULED / DELETED
  status: String @col(name: "status", dataType: "varchar(30)")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")

  # Owner identity is anchored in Firebase Auth and the organization's Worker.
  # The registration flow must keep ownerUid aligned with
  # OrganizationSubscription.billingOwnerUid.
  ownerUid: String @col(name: "owner_uid", dataType: "varchar(128)")
  ownerWorkerId: String @col(name: "owner_worker_id", dataType: "varchar(128)")

  # ISO 3166-1 alpha-2 country, BCP 47 locale, IANA timezone and ISO 4217 currency.
  countryCode: String @col(name: "country_code", dataType: "varchar(2)")
  locale: String @col(name: "locale", dataType: "varchar(10)")
  timezone: String @col(name: "timezone", dataType: "varchar(60)")
  currencyCode: String @col(name: "currency_code", dataType: "varchar(3)")
  dataRegion: String @col(name: "data_region", dataType: "varchar(20)")

  # STARTED / COMPANY_COMPLETED / USER_COMPLETED / COMPLETED
  onboardingStatus: String @col(name: "onboarding_status", dataType: "varchar(30)")
  # WEB / ADMIN / PARTNER / IMPORT
  registrationSource: String @col(name: "registration_source", dataType: "varchar(30)")

  createdByUid: String @col(name: "created_by_uid", dataType: "varchar(128)")
  updatedByUid: String @col(name: "updated_by_uid", dataType: "varchar(128)")
  updatedAt: Timestamp @col(name: "updated_at") @default(expr: "request.time")
  activatedAt: Timestamp @col(name: "activated_at")
  suspendedAt: Timestamp @col(name: "suspended_at")
  deletionScheduledAt: Timestamp @col(name: "deletion_scheduled_at")
  purgeAfter: Timestamp @col(name: "purge_after")
  deletedAt: Timestamp @col(name: "deleted_at")
}
type OrganizationMember @table(
  name: "organization_member",
  singular: "organizationMember",
  plural: "organizationMembers",
  key: ["orgId", "uid"]
)
@index(name: "organization_member_uid_org_lookup_idx", fields: ["uid", "orgId"])
@index(name: "organization_member_org_worker_idx", fields: ["orgId", "workerId"]) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")

  uid: String! @col(name: "uid", dataType: "varchar(128)")
  # Legacy compatibility field. New modules should treat Worker.role as the
  # target source of truth. New OWNER records may temporarily set both fields.
  role: String! @col(name: "role", dataType: "varchar(30)")

  # Nullable during migration. Backfill before adding the target uniqueness.
  workerId: String @col(name: "worker_id", dataType: "varchar(128)")
  # INVITED / ACTIVE / SUSPENDED / REMOVED
  status: String @col(name: "status", dataType: "varchar(30)")
  consumesSeat: Boolean @col(name: "consumes_seat") @default(value: true)
  invitedAt: Timestamp @col(name: "invited_at")
  joinedAt: Timestamp @col(name: "joined_at")
  lastSeenAt: Timestamp @col(name: "last_seen_at")
  createdByUid: String @col(name: "created_by_uid", dataType: "varchar(128)")
  updatedAt: Timestamp @col(name: "updated_at") @default(expr: "request.time")
  removedAt: Timestamp @col(name: "removed_at")
  removedByUid: String @col(name: "removed_by_uid", dataType: "varchar(128)")

  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
}

type Worker @table(
  name: "worker",
  singular: "worker",
  plural: "workers",
  key: ["orgId", "login"]
)
@index(name: "worker_org_worker_id_idx", fields: ["orgId", "workerId"])
@index(name: "worker_auth_uid_idx", fields: ["authUid"])
@index(name: "worker_org_login_normalized_idx", fields: ["orgId", "loginNormalized"])
@index(name: "worker_org_email_normalized_idx", fields: ["orgId", "emailNormalized"])
@unique(indexName: "worker_org_login_normalized_uidx", fields: ["orgId", "loginNormalized"])
@unique(indexName: "worker_org_worker_id_normalized_uidx", fields: ["orgId", "workerIdNormalized"]) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")

  login: String! @col(name: "login", dataType: "varchar(80)")
  workerId: String @col(name: "worker_id", dataType: "varchar(128)")
  workerName: String @col(name: "full_name")

  firstName: String @col(name: "first_name", dataType: "varchar(80)")
  lastName: String @col(name: "last_name", dataType: "varchar(80)")
  loginNormalized: String @col(name: "login_normalized", dataType: "varchar(80)")
  workerIdNormalized: String @col(name: "worker_id_normalized", dataType: "varchar(128)")
  emailNormalized: String @col(name: "email_normalized", dataType: "varchar(180)")
  phoneNormalized: String @col(name: "phone_normalized", dataType: "varchar(40)")

  # Login email do aplikacji: np. franosz@bestclean.pl
  loginEmail: String @col(name: "login_email", dataType: "varchar(160)")

  # UID z Firebase Auth
  authUid: String @col(name: "auth_uid", dataType: "varchar(128)")

  # OWNER / ADMIN / MANAGER / COORDINATOR / WORKER.
  # OWNER cannot be downgraded through the regular UI. Ownership transfer must
  # use a support-controlled, audited process.
  role: String @col(name: "role", dataType: "varchar(32)")
  roleLocked: Boolean @col(name: "role_locked") @default(value: false)
  # ORGANIZATION_OWNER for the founding owner.
  roleLockedReason: String @col(name: "role_locked_reason", dataType: "varchar(60)")
  roleAssignedAt: Timestamp @col(name: "role_assigned_at")
  roleLockedAt: Timestamp @col(name: "role_locked_at")

  active: Boolean @col(name: "active")
  email: String @col(name: "email")
  phone: String @col(name: "phone")
  # Operational type, for example CLEANER / SUPERVISOR / OFFICE / OTHER.
  # This is not a source of system permissions.
  workerType: String @col(name: "worker_type", dataType: "varchar(40)")

  # INVITED / ACTIVE / BLOCKED / REMOVED
  status: String @col(name: "status", dataType: "varchar(30)")
  # ACTIVE / INACTIVE / TERMINATED / ARCHIVED
  employmentStatus: String @col(name: "employment_status", dataType: "varchar(30)")
  position: String @col(name: "position", dataType: "varchar(100)")
  locale: String @col(name: "locale", dataType: "varchar(10)")
  timezone: String @col(name: "timezone", dataType: "varchar(60)")
  invitedAt: Timestamp @col(name: "invited_at")
  activatedAt: Timestamp @col(name: "activated_at")
  lastLoginAt: Timestamp @col(name: "last_login_at")
  createdByUid: String @col(name: "created_by_uid", dataType: "varchar(128)")
  updatedByUid: String @col(name: "updated_by_uid", dataType: "varchar(128)")
  deletedAt: Timestamp @col(name: "deleted_at")
  deletedByUid: String @col(name: "deleted_by_uid", dataType: "varchar(128)")
  externalRef: String @col(name: "external_ref", dataType: "varchar(120)")

  createdAt: Timestamp @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp @col(name: "updated_at") @default(expr: "request.time")
  edit: String @col(name: "edit")
}

# =========================
# REGISTRATION AND SAAS (ADDITIVE)
# =========================

type OrganizationCompanyProfile @table(
  name: "organization_company_profile",
  singular: "organizationCompanyProfile",
  plural: "organizationCompanyProfiles",
  key: "orgId"
)
@index(name: "organization_company_profile_registration_tax_idx", fields: ["registrationCountryCode", "taxIdNormalized"])
@index(name: "organization_company_profile_vat_idx", fields: ["vatIdNormalized"])
@index(name: "organization_company_profile_registry_idx", fields: ["businessRegistryId"]) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")

  legalName: String! @col(name: "legal_name", dataType: "varchar(180)")
  brandName: String @col(name: "brand_name", dataType: "varchar(180)")
  registrationCountryCode: String! @col(name: "registration_country_code", dataType: "varchar(2)")
  # NIP / TIN / EIN / TAX_ID / OTHER
  taxIdType: String @col(name: "tax_id_type", dataType: "varchar(30)")
  taxIdValue: String @col(name: "tax_id_value", dataType: "varchar(64)")
  taxIdNormalized: String @col(name: "tax_id_normalized", dataType: "varchar(64)")
  vatIdValue: String @col(name: "vat_id_value", dataType: "varchar(64)")
  vatIdNormalized: String @col(name: "vat_id_normalized", dataType: "varchar(64)")
  businessRegistryId: String @col(name: "business_registry_id", dataType: "varchar(64)")

  # Global address model suitable for Poland, the EU and the US.
  addressLine1: String @col(name: "address_line_1", dataType: "varchar(180)")
  addressLine2: String @col(name: "address_line_2", dataType: "varchar(180)")
  locality: String @col(name: "locality", dataType: "varchar(100)")
  administrativeArea: String @col(name: "administrative_area", dataType: "varchar(100)")
  postalCode: String @col(name: "postal_code", dataType: "varchar(20)")
  countryCode: String! @col(name: "country_code", dataType: "varchar(2)")

  billingEmail: String @col(name: "billing_email", dataType: "varchar(180)")
  billingPhone: String @col(name: "billing_phone", dataType: "varchar(40)")
  invoiceEmail: String @col(name: "invoice_email", dataType: "varchar(180)")
  websiteUrl: String @col(name: "website_url", dataType: "varchar(200)")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
}

type OrganizationSubscription @table(
  name: "organization_subscription",
  singular: "organizationSubscription",
  plural: "organizationSubscriptions",
  key: "orgId"
)
@index(name: "organization_subscription_status_billing_idx", fields: ["status", "nextBillingAt"])
@index(name: "organization_subscription_status_purge_idx", fields: ["status", "purgeAfter"])
@index(name: "organization_subscription_provider_idx", fields: ["providerSubscriptionId"])
@index(name: "organization_subscription_billing_owner_idx", fields: ["billingOwnerUid"]) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")

  # Must match Organization.ownerUid for the founding owner. Only OWNER may
  # manage or renew the subscription through the regular product flow.
  billingOwnerUid: String! @col(name: "billing_owner_uid", dataType: "varchar(128)")
  billingOwnerWorkerId: String! @col(name: "billing_owner_worker_id", dataType: "varchar(64)")
  # DEMO / START / PRO
  planCode: String! @col(name: "plan_code", dataType: "varchar(30)")
  # TRIALING / ACTIVE / PAST_DUE / SUSPENDED / CANCELED / EXPIRED /
  # DELETION_SCHEDULED
  status: String! @col(name: "status", dataType: "varchar(30)")
  # MONTHLY / YEARLY
  billingCycle: String @col(name: "billing_cycle", dataType: "varchar(20)")
  currencyCode: String! @col(name: "currency_code", dataType: "varchar(3)")
  unitAmountMinor: Int64 @col(name: "unit_amount_minor")
  totalAmountMinor: Int64 @col(name: "total_amount_minor")
  seatLimit: Int @col(name: "seat_limit")

  trialStartedAt: Timestamp @col(name: "trial_started_at")
  trialEndsAt: Timestamp @col(name: "trial_ends_at")
  activatedAt: Timestamp @col(name: "activated_at")
  currentPeriodStartedAt: Timestamp @col(name: "current_period_started_at")
  currentPeriodEndsAt: Timestamp @col(name: "current_period_ends_at")
  nextBillingAt: Timestamp @col(name: "next_billing_at")
  nextPaymentAttemptAt: Timestamp @col(name: "next_payment_attempt_at")
  lastPaymentAt: Timestamp @col(name: "last_payment_at")
  pastDueAt: Timestamp @col(name: "past_due_at")
  gracePeriodEndsAt: Timestamp @col(name: "grace_period_ends_at")
  suspendedAt: Timestamp @col(name: "suspended_at")
  expiredAt: Timestamp @col(name: "expired_at")

  cancelAtPeriodEnd: Boolean! @col(name: "cancel_at_period_end") @default(value: false)
  canceledAt: Timestamp @col(name: "canceled_at")
  canceledByUid: String @col(name: "canceled_by_uid", dataType: "varchar(128)")
  cancellationReason: String @col(name: "cancellation_reason", dataType: "varchar(160)")
  deletionScheduledAt: Timestamp @col(name: "deletion_scheduled_at")
  # Planned permanent deletion or anonymization time after the retention period.
  purgeAfter: Timestamp @col(name: "purge_after")

  # STRIPE / PAYU / PRZELEWY24 / MANUAL
  provider: String @col(name: "provider", dataType: "varchar(40)")
  providerCustomerId: String @col(name: "provider_customer_id", dataType: "varchar(160)")
  providerSubscriptionId: String @col(name: "provider_subscription_id", dataType: "varchar(160)")
  discountCode: String @col(name: "discount_code", dataType: "varchar(80)")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
}

type SubscriptionPayment @table(
  name: "subscription_payment",
  singular: "subscriptionPayment",
  plural: "subscriptionPayments",
  key: ["orgId", "paymentId"]
)
@index(name: "subscription_payment_org_created_idx", fields: ["orgId", "createdAt"])
@index(name: "subscription_payment_org_status_idx", fields: ["orgId", "status"])
@index(name: "subscription_payment_provider_payment_idx", fields: ["providerPaymentId"])
@index(name: "subscription_payment_provider_transaction_idx", fields: ["providerTransactionId"])
@index(name: "subscription_payment_idempotency_idx", fields: ["idempotencyKey"]) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
