  paymentId: String! @col(name: "payment_id", dataType: "varchar(64)")

  billingOwnerUid: String @col(name: "billing_owner_uid", dataType: "varchar(128)")
  # INITIAL / RENEWAL / PLAN_CHANGE / RETRY / MANUAL
  paymentType: String! @col(name: "payment_type", dataType: "varchar(30)")
  # CREATED / PENDING / AUTHORIZED / PAID / FAILED / CANCELED / REFUNDED /
  # PARTIALLY_REFUNDED
  status: String! @col(name: "status", dataType: "varchar(30)")
  currencyCode: String! @col(name: "currency_code", dataType: "varchar(3)")
  amountNetMinor: Int64 @col(name: "amount_net_minor")
  taxMinor: Int64 @col(name: "tax_minor")
  amountGrossMinor: Int64! @col(name: "amount_gross_minor")
  refundedAmountMinor: Int64 @col(name: "refunded_amount_minor")

  periodStartedAt: Timestamp @col(name: "period_started_at")
  periodEndsAt: Timestamp @col(name: "period_ends_at")
  paymentProvider: String @col(name: "payment_provider", dataType: "varchar(40)")
  providerPaymentId: String @col(name: "provider_payment_id", dataType: "varchar(160)")
  providerInvoiceId: String @col(name: "provider_invoice_id", dataType: "varchar(160)")
  providerTransactionId: String @col(name: "provider_transaction_id", dataType: "varchar(160)")
  idempotencyKey: String @col(name: "idempotency_key", dataType: "varchar(160)")

  paymentStartedAt: Timestamp @col(name: "payment_started_at")
  paidAt: Timestamp @col(name: "paid_at")
  failedAt: Timestamp @col(name: "failed_at")
  canceledAt: Timestamp @col(name: "canceled_at")
  refundedAt: Timestamp @col(name: "refunded_at")
  failureCode: String @col(name: "failure_code", dataType: "varchar(80)")
  failureReason: String @col(name: "failure_reason")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
}

type SubscriptionEvent @table(
  name: "subscription_event",
  singular: "subscriptionEvent",
  plural: "subscriptionEvents",
  key: ["orgId", "subscriptionEventId"]
)
@index(name: "subscription_event_org_occurred_idx", fields: ["orgId", "occurredAt"])
@index(name: "subscription_event_org_type_idx", fields: ["orgId", "eventType"])
@index(name: "subscription_event_provider_idx", fields: ["providerEventId"])
@index(name: "subscription_event_payment_idx", fields: ["paymentId"]) {
  orgId: String! @col(name: "org_id", dataType: "varchar(64)")
  organization: Organization! @ref(fields: "orgId", references: "orgId")
  subscriptionEventId: String! @col(name: "subscription_event_id", dataType: "varchar(64)")

  # SUBSCRIPTION_CREATED / TRIAL_STARTED / TRIAL_ENDED / PAYMENT_PAID /
  # PAYMENT_FAILED / SUBSCRIPTION_RENEWED / PLAN_CHANGED /
  # SUBSCRIPTION_CANCELED / ORGANIZATION_SUSPENDED /
  # ORGANIZATION_REACTIVATED / DELETION_SCHEDULED / DATA_PURGED
  eventType: String! @col(name: "event_type", dataType: "varchar(60)")
  previousStatus: String @col(name: "previous_status", dataType: "varchar(30)")
  newStatus: String @col(name: "new_status", dataType: "varchar(30)")
  previousPlanCode: String @col(name: "previous_plan_code", dataType: "varchar(30)")
  newPlanCode: String @col(name: "new_plan_code", dataType: "varchar(30)")
  actorUid: String @col(name: "actor_uid", dataType: "varchar(128)")
  actorWorkerId: String @col(name: "actor_worker_id", dataType: "varchar(64)")
  # USER / SYSTEM / PAYMENT_PROVIDER / SUPPORT
  source: String @col(name: "source", dataType: "varchar(30)")
  paymentId: String @col(name: "payment_id", dataType: "varchar(64)")
  providerEventId: String @col(name: "provider_event_id", dataType: "varchar(160)")
  reason: String @col(name: "reason")
  metadata: Any @col(name: "metadata")
  occurredAt: Timestamp! @col(name: "occurred_at") @default(expr: "request.time")
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
}

type UserConsent @table(
