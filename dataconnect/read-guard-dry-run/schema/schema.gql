  completedAt: Timestamp @col(name: "completed_at")
  failedAt: Timestamp @col(name: "failed_at")
  abandonedAt: Timestamp @col(name: "abandoned_at")
  expiresAt: Timestamp @col(name: "expires_at")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")
}

type AuditLog @table(
  name: "audit_log",
  singular: "auditLog",
  plural: "auditLogs",
  key: "auditId"
)
@index(name: "audit_log_org_occurred_idx", fields: ["orgId", "occurredAt"])
@index(name: "audit_log_entity_idx", fields: ["entityType", "entityId"])
@index(name: "audit_log_actor_occurred_idx", fields: ["actorUid", "occurredAt"])
