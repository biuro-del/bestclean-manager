# Connector-only read guard delta. These queries retain the deployed authorization
# predicate and selected fields while replacing fixed 5,000-row reads with pages.

query WorkersPageForOrg($orgId: String!, $limit: Int, $offset: Int) @auth(level: USER) {
  organizationMember(key: { orgId: $orgId, uid_expr: "auth.uid" }) @redact
    @check(expr: "this != null", message: "Brak dostepu do tej organizacji.") {
      role @check(expr: "this in ['ADMIN','OWNER','MANAGER','COORDINATOR','WORKER']", message: "Brak roli w organizacji.")
    }

  organization(key: { orgId: $orgId }) {
    ownerWorkerId
  }

  workers(
    limit: $limit
    offset: $offset
    where: { orgId: { eq: $orgId } }
    orderBy: [{ login: ASC }]
  ) {
    login
    workerId
    workerName
    loginEmail
    authUid
    role
    active
    email
    phone
    workerType
    edit
    createdAt
    updatedAt
  }
}

query WorkerForOrgByLogin($orgId: String!, $workerLogin: String!) @auth(level: USER) {
  organizationMember(key: { orgId: $orgId, uid_expr: "auth.uid" }) @redact
    @check(expr: "this != null", message: "Brak dostepu do tej organizacji.") {
      role @check(expr: "this in ['ADMIN','OWNER','MANAGER','COORDINATOR','WORKER']", message: "Brak roli w organizacji.")
    }

  worker(key: { orgId: $orgId, login: $workerLogin }) {
    login
    workerId
    workerName
    loginEmail
    authUid
    role
    active
    email
    phone
    workerType
    edit
    createdAt
    updatedAt
  }
}

