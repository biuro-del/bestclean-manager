      role @check(expr: "this in ['ADMIN','OWNER','MANAGER','COORDINATOR','WORKER']", message: "Brak roli w organizacji.")
    }

  backupCycles(
    limit: $limit
    offset: $offset
    where: { orgId: { eq: $orgId } }
    orderBy: [{ editedAt: DESC }, { cycleId: DESC }]
  ) {
    workdayId: cycleId
    workerLogin
    workerName
    utilityRoomId: roomId
    strefa
    pomieszczenie
    startAt
    endAt
    durationSec
    status
    comment
