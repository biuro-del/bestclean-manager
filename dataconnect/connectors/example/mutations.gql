mutation DeleteClientForOrg(
  $orgId: String!
  $clientId: String!
) @auth(level: USER) @transaction {
  query @redact {
    organizationMember(key: { orgId: $orgId, uid_expr: "auth.uid" })
      @check(expr: "this != null", message: "Brak dostepu do tej organizacji.") {
        role @check(expr: "this in ['ADMIN']", message: "Klienta moze usunac tylko Admin.")
      }

    currentClient: client(key: { orgId: $orgId, clientId: $clientId })
      @check(expr: "this != null", message: "Nie znaleziono klienta w tej organizacji.") {
        clientId
      }
  }

  checkListLog_deleteMany(
    where: { orgId: { eq: $orgId }, clientId: { eq: $clientId } }
  )

  checkListExtra_deleteMany(
    where: { orgId: { eq: $orgId }, clientId: { eq: $clientId } }
  )

  checkListDef_deleteMany(
    where: { orgId: { eq: $orgId }, clientId: { eq: $clientId } }
  )

  clientStorage_deleteMany(
    where: { orgId: { eq: $orgId }, clientId: { eq: $clientId } }
  )

  event_deleteMany(
    where: { orgId: { eq: $orgId }, zone: { clientId: { eq: $clientId } } }
  )

  task_deleteMany(
    where: { orgId: { eq: $orgId }, clientId: { eq: $clientId } }
  )

  zone_deleteMany(
    where: { orgId: { eq: $orgId }, clientId: { eq: $clientId } }
  )

  client_delete(key: { orgId: $orgId, clientId: $clientId })
}

