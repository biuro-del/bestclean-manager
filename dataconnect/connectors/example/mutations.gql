mutation StartWorkdayPause(
  $orgId: String!
  $pauseId: String!
  $workdayId: String!
  $workerLogin: String!
  $workerName: String
  $startAt: Timestamp
  $stopAt: Timestamp
  $durationSec: Int
  $status: String
  $pauseEventId: String
  $deviceId: String
) @auth(level: USER) @transaction {
  query @redact {
    organizationMember(key: { orgId: $orgId, uid_expr: "auth.uid" })
      @check(expr: "this != null", message: "Brak dostepu do tej organizacji.") {
        role @check(expr: "this in ['ADMIN','MANAGER','COORDINATOR'] || (this == 'WORKER' && response.query.targetWorker.authUid == auth.uid)", message: "Brak uprawnien do zapisu pauzy.")
      }
    targetWorker: worker(key: { orgId: $orgId, login: $workerLogin }) {
      authUid
    }

    workday(key: { orgId: $orgId, workdayId: $workdayId })
      @check(expr: "this != null", message: "Brak aktywnego dnia pracy.") {
        status @check(expr: "this == 'RUNNING'", message: "Pauza jest dostepna tylko dla dnia RUNNING.")
        pauseOpenId @check(expr: "this == null", message: "Masz juz aktywna pauze.")
      }
  }

  workdayPause_insert(data: {
    orgId: $orgId
    pauseId: $pauseId
    workdayId: $workdayId
    workerLogin: $workerLogin
    workerName: $workerName
    startAt: $startAt
    stopAt: $stopAt
    durationSec: $durationSec
    status: $status
    pauseEventId: $pauseEventId
    deviceId: $deviceId
    createdAt_expr: "request.time"
    updatedAt_expr: "request.time"
  })

  workday_update(
    key: { orgId: $orgId, workdayId: $workdayId }
    data: {
      pauseOpenId: $pauseId
      pauseOpenAt: $startAt
      updatedAt_expr: "request.time"
    }
  )
}

mutation StopWorkdayPause(
  $orgId: String!
  $pauseId: String!
  $workdayId: String!
  $workerLogin: String!
  $stopAt: Timestamp
  $durationSec: Int
  $status: String
) @auth(level: USER) @transaction {
  query @redact {
    organizationMember(key: { orgId: $orgId, uid_expr: "auth.uid" })
      @check(expr: "this != null", message: "Brak dostepu do tej organizacji.") {
        role @check(expr: "this in ['ADMIN','MANAGER','COORDINATOR'] || (this == 'WORKER' && response.query.targetWorker.authUid == auth.uid)", message: "Brak uprawnien do zapisu pauzy.")
      }
    targetWorker: worker(key: { orgId: $orgId, login: $workerLogin }) {
      authUid
    }

    workdayPause(key: { orgId: $orgId, pauseId: $pauseId })
      @check(expr: "this != null", message: "Nie znaleziono aktywnej pauzy.") {
        status @check(expr: "this == 'RUNNING'", message: "Pauza jest juz zakonczona.")
      }
  }

  workdayPause_update(
    key: { orgId: $orgId, pauseId: $pauseId }
    data: {
      stopAt: $stopAt
      durationSec: $durationSec
      status: $status
      updatedAt_expr: "request.time"
    }
  )

  workday_update(
    key: { orgId: $orgId, workdayId: $workdayId }
    data: {
      pauseOpenId: null
      pauseOpenAt: null
      updatedAt_expr: "request.time"
    }
  )
}

