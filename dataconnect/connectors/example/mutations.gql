mutation RenameWorkerForOrg(
  $orgId: String!
  $login: String!
  $newLogin: String! = ""
  $workerName: String
  $loginEmail: String
  $authUid: String! = ""
  $role: String
  $memberRole: String
  $active: Boolean
  $email: String
  $phone: String
  $workerType: String
  $workerId: String
  $createdAt: Timestamp
  $edit: String
  $name: String @retired
) @auth(level: USER) @transaction {
  query @redact {
    organizationMember(key: { orgId: $orgId, uid_expr: "auth.uid" })
      @check(expr: "this != null", message: "Brak dostepu do tej organizacji.") {
        role @check(expr: "this in ['ADMIN']", message: "Login pracownika moze zmienic tylko Admin.")
      }

    currentWorker: worker(key: { orgId: $orgId, login: $login })
      @check(expr: "this != null", message: "Nie znaleziono pracownika w tej organizacji.") {
        orgId @retired
        login
      }

    targetWorker: worker(key: { orgId: $orgId, login: $newLogin })
      @check(expr: "this == null", message: "Ten login jest juz zajety w tej organizacji.") {
        orgId @retired
        login
      }
  }

  worker_insert(data: {
    orgId: $orgId
    login: $newLogin
    workerName: $workerName
    loginEmail: $loginEmail
    authUid: $authUid
    role: $role
    active: $active
    email: $email
    phone: $phone
    workerType: $workerType
    workerId: $workerId
    createdAt: $createdAt
    updatedAt_expr: "request.time"
    edit: $edit
  })

  organizationMember_upsert(data: {
    orgId: $orgId
    uid: $authUid
    role: $memberRole
  })

  workdayPause_updateMany(
    where: { orgId: { eq: $orgId }, workerLogin: { eq: $login } }
    data: {
      workerLogin: $newLogin
      workerName: $workerName
      updatedAt_expr: "request.time"
    }
  )

  event_updateMany(
    where: { orgId: { eq: $orgId }, workerLogin: { eq: $login } }
    data: {
      workerLogin: $newLogin
      workerName: $workerName
      updatedAt_expr: "request.time"
    }
  )

  workday_updateMany(
    where: { orgId: { eq: $orgId }, workerLogin: { eq: $login } }
    data: {
      workerLogin: $newLogin
      workerName: $workerName
      updatedAt_expr: "request.time"
    }
  )

  backupCycle_updateMany(
    where: { orgId: { eq: $orgId }, workerLogin: { eq: $login } }
    data: {
      workerLogin: $newLogin
      workerName: $workerName
      editedAt_expr: "request.time"
    }
  )

  checkListLog_updateMany(
    where: { orgId: { eq: $orgId }, workerLogin: { eq: $login } }
    data: {
      workerLogin: $newLogin
    }
  )

  taskLogin_update: task_updateMany(
    where: { orgId: { eq: $orgId }, workerLogin: { eq: $login } }
    data: {
      workerLogin: $newLogin
      workerName: $workerName
      workerLabel: $workerName
      updatedAt_expr: "request.time"
    }
  )

  taskWorkerId_update: task_updateMany(
    where: { orgId: { eq: $orgId }, workerId: { eq: $login } }
    data: {
      workerId: $newLogin
      updatedAt_expr: "request.time"
    }
  )

  workerCredential_updateMany(
    where: { orgId: { eq: $orgId }, login: { eq: $login } }
    data: {
      login: $newLogin
      updatedBy: $edit
      updatedAt_expr: "request.time"
    }
  )

  worker_delete(key: { orgId: $orgId, login: $login })
}

mutation DeleteWorkerProfileForOrg(
  $orgId: String!
  $login: String!
  $workerId: String! = ""
  $authUid: String! = ""
) @auth(level: USER) @transaction {
  query @redact {
    organizationMember(key: { orgId: $orgId, uid_expr: "auth.uid" })
      @check(expr: "this != null", message: "Brak dostepu do tej organizacji.") {
        role @check(expr: "this in ['ADMIN']", message: "Pracownika moze usunac tylko Admin.")
      }

    currentWorker: worker(key: { orgId: $orgId, login: $login })
      @check(expr: "this != null", message: "Nie znaleziono pracownika w tej organizacji.") {
        orgId @retired
        login
      }
  }

  workerCredential_deleteMany(
    where: { orgId: { eq: $orgId }, login: { eq: $login } }
  )

  workdayPause_deleteMany(
    where: { orgId: { eq: $orgId }, workerLogin: { eq: $login } }
  )

  event_deleteMany(
    where: { orgId: { eq: $orgId }, workerLogin: { eq: $login } }
  )

  checkListLog_deleteMany(
    where: { orgId: { eq: $orgId }, workerLogin: { eq: $login } }
  )

  backupCycle_deleteMany(
    where: { orgId: { eq: $orgId }, workerLogin: { eq: $login } }
  )

  taskLogin_delete: task_deleteMany(
    where: { orgId: { eq: $orgId }, workerLogin: { eq: $login } }
  )

  taskWorkerId_delete: task_deleteMany(
    where: { orgId: { eq: $orgId }, workerId: { eq: $workerId } }
  )

  workday_deleteMany(
    where: { orgId: { eq: $orgId }, workerLogin: { eq: $login } }
  )

  organizationMember_deleteMany(
    where: { orgId: { eq: $orgId }, uid: { eq: $authUid } }
  )

  worker_delete(key: { orgId: $orgId, login: $login })
}

mutation UpsertWorkerCredentialForOrg(
  $orgId: String!
  $login: String!
  $encryptedPassword: String!
  $iv: String!
  $authTag: String!
  $algorithm: String!
  $updatedBy: String
) @auth(level: USER) @transaction {
  query @redact {
    organizationMember(key: { orgId: $orgId, uid_expr: "auth.uid" })
      @check(expr: "this != null", message: "Brak dostepu do tej organizacji.") {
        role @check(expr: "this in ['ADMIN']", message: "Brak uprawnien do zapisu hasla pracownika.")
      }
    worker(key: { orgId: $orgId, login: $login })
      @check(expr: "this != null", message: "Nie znaleziono pracownika w tej organizacji.") {
        login
      }
  }

  workerCredential_upsert(data: {
    orgId: $orgId
    login: $login
    encryptedPassword: $encryptedPassword
    iv: $iv
    authTag: $authTag
    algorithm: $algorithm
    updatedBy: $updatedBy
    updatedAt_expr: "request.time"
  })
}

