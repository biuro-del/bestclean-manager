mutation InsertWorkdayForOrg(
  $orgId: String!
  $workdayId: String!
  $workerLogin: String!
  $workerName: String
  $utilityRoomId: String
  $startAt: Timestamp
  $endAt: Timestamp
  $durationSec: Int
  $status: String
  $gps: String
  $comment: String
  $updatedBy: String
) @auth(level: USER) @transaction {
  query @redact {
    organizationMember(key: { orgId: $orgId, uid_expr: "auth.uid" })
      @check(expr: "this != null", message: "Brak dostepu do tej organizacji.") {
        role @check(expr: "this in ['ADMIN','MANAGER','COORDINATOR'] || (this == 'WORKER' && response.query.targetWorker.authUid == auth.uid)", message: "Brak uprawnien do dodawania zdarzen.")
      }
    targetWorker: worker(key: { orgId: $orgId, login: $workerLogin }) {
      authUid
    }
  }

  workday_insert(data: {
    orgId: $orgId
    workdayId: $workdayId
    workerLogin: $workerLogin
    workerName: $workerName
    utilityRoomId: $utilityRoomId
    startAt: $startAt
    endAt: $endAt
    durationSec: $durationSec
    status: $status
    gps: $gps
    comment: $comment
    updatedBy: $updatedBy
    updatedAt_expr: "request.time"
  })
}

