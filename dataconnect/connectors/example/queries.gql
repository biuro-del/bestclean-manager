query WorkdayPausesForOrg($orgId: String!) @auth(level: USER) {
  organizationMember(key: { orgId: $orgId, uid_expr: "auth.uid" }) @redact
    @check(expr: "this != null", message: "Brak dostepu do tej organizacji.") {
      role @check(expr: "this in ['ADMIN','MANAGER','COORDINATOR','WORKER']", message: "Brak roli w organizacji.")
    }

  workdayPauses(
    where: { orgId: { eq: $orgId } }
    orderBy: [{ startAt: DESC }]
    limit: 5000
  ) {
    pauseId
    workdayId
    workerLogin
    workerName
    deviceId
    pauseEventId
    startAt
    stopAt
    durationSec
    status
    createdAt
    updatedAt
  }
}

query ActiveWorkdayPauseForWorker($orgId: String!, $workerLogin: String!) @auth(level: USER) {
  organizationMember(key: { orgId: $orgId, uid_expr: "auth.uid" }) @redact
    @check(expr: "this != null", message: "Brak dostepu do tej organizacji.") {
      role @check(expr: "this in ['ADMIN','MANAGER','COORDINATOR','WORKER']", message: "Brak roli w organizacji.")
    }

  workdayPauses(
    where: {
      orgId: { eq: $orgId }
      workerLogin: { eq: $workerLogin }
      status: { eq: "RUNNING" }
    }
    orderBy: [{ startAt: DESC }]
    limit: 1
  ) {
    pauseId
    workdayId
    workerLogin
    workerName
    deviceId
    pauseEventId
    startAt
    stopAt
    durationSec
    status
    createdAt
    updatedAt
  }
}

