# dataconnect/example/queries.gql
# Membership-scoped queries (console + app)
# Uses auth.uid (UID).
# In Firebase Console -> Authentication -> Claims:
# { "sub": "<USER_UID>" }

query MyOrganizations @auth(level: USER) {
  organizationMembers(
    where: {
      uid: { eq_expr: "auth.uid" }
      status: { eq: "ACTIVE" }
    }
    orderBy: [{ orgId: ASC }]
  ) {
    orgId
    role
    workerId
    status
    organization { orgId name status }
  }
}

query OrgUiStyleForOrg($orgId: String!) @auth(level: USER) {
  organizationMember(key: { orgId: $orgId, uid_expr: "auth.uid" }) @redact
    @check(expr: "this != null", message: "Brak dostepu do tej organizacji.") {
      status @check(expr: "this == 'ACTIVE'", message: "Czlonkostwo w organizacji jest nieaktywne.")
      role @check(expr: "this in ['ADMIN','ADMINISTRATOR','OWNER','SUPERADMIN','MANAGER','KIEROWNIK','COORDINATOR','KOORDYNATOR','MEMBER','WORKER','PRACOWNIK','INTERN','STAZYSTA','STAŻYSTA']", message: "Brak roli w organizacji.")
    }

  orgUiStyle(key: { orgId: $orgId }) {
    orgId
    defaultStyleId
    updatedAt
    updatedBy
  }
}

