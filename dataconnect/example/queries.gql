      role @check(expr: "this in ['ADMIN','MANAGER','WORKER']", message: "Brak roli w organizacji.")
    }

  events: backupCycles(where: { orgId: { eq: $orgId } }, orderBy: [{ startAt: DESC }]) {
    eventId: cycleId
    zoneId: roomId
    workerLogin
    workerName
    startAt
    endAt
    durationSec
    status
    closeMarkedAt
    endReason
    comment
    deviceId
    startEventId
    endEventId
    updatedAt: editedAt
    createdAt
