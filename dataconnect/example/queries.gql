# dataconnect/example/queries.gql
# Membership-scoped queries (console + app)
# Uses auth.token.sub (UID).
# In Firebase Console -> Authentication -> Claims:
# { "sub": "<USER_UID>" }

query MyOrganizations @auth(level: USER) {
  organizationMembers(
    where: { uid: { eq_expr: "auth.token.sub" } }
    orderBy: [{ orgId: ASC }]
  ) {
    orgId
    role
    organization { orgId name status }
  }
}

query WorkersForOrg($orgId: String!) @auth(level: USER) {
  organizationMember(key: { orgId: $orgId, uid_expr: "auth.token.sub" }) @redact
    @check(expr: "this != null", message: "Brak dostepu do tej organizacji.") {
      role @check(expr: "this in ['ADMIN','MANAGER','WORKER']", message: "Brak roli w organizacji.")
    }

  workers(where: { orgId: { eq: $orgId } }, orderBy: [{ fullName: ASC }]) {
    login
    fullName
    loginEmail
    role
    active
    workerType
  }
}

