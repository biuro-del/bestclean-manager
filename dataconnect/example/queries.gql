}

query WorkerWorkdaysForOrg($orgId: String!, $workerLogin: String!) @auth(level: USER) {
  organizationMember(key: { orgId: $orgId, uid_expr: "auth.token.sub" }) @redact
    @check(expr: "this != null", message: "Brak dostepu do tej organizacji.") {
      role @check(expr: "this in ['ADMIN','MANAGER','WORKER']", message: "Brak roli w organizacji.")
    }

  workdays(
    where: { orgId: { eq: $orgId }, workerLogin: { eq: $workerLogin } }
    orderBy: [{ startAt: DESC }]
  ) {
    workdayId
    workerLogin
    workerName
    utilityRoomId
    startAt
    endAt
    durationSec
    status
    comment
    updatedBy
    updatedAt
  }
}
