mutation InsertEventForOrg(
  $orgId: String!
  $eventId: String!
  $zoneId: String
  $workerLogin: String
  $startAt: Timestamp
  $endAt: Timestamp
  $durationSec: Int
  $status: String
  $closeMarkedAt: Timestamp
  $endReason: String
  $comment: String
  $deviceId: String
  $startEventId: String
  $endEventId: String
) @auth(level: USER) @transaction {
  query @redact {
    organizationMember(key: { orgId: $orgId, uid_expr: "auth.token.sub" })
      @check(expr: "this != null", message: "Brak dostepu do tej organizacji.") {
        role @check(expr: "this in ['ADMIN','MANAGER','WORKER']", message: "Brak uprawnien do dodawania zdarzen.")
      }
  }

  event_insert: backupCycle_insert(data: {
    orgId: $orgId
    cycleId: $eventId
    workerLogin: $workerLogin
    roomId: $zoneId
    startAt: $startAt
    endAt: $endAt
    durationSec: $durationSec
    status: $status
    closeMarkedAt: $closeMarkedAt
    endReason: $endReason
    comment: $comment
    deviceId: $deviceId
    startEventId: $startEventId
    endEventId: $endEventId
    editedAt_expr: "request.time"
    createdAt_expr: "request.time"
  })
}

