# dataconnect/example/mutations.gql
# Membership-checked mutations (console + app)
# Uses auth.token.sub (UID).
# In Firebase Console -> Authentication -> Claims:
# { "sub": "<USER_UID>" }

mutation InsertWorkerForOrg(
  $orgId: String!
  $login: String!
  $fullName: String
  $loginEmail: String
  $role: String
  $active: Boolean
  $email: String
  $phone: String
  $workerType: String
  $workerId: String
) @auth(level: USER) @transaction {
  query @redact {
    organizationMember(key: { orgId: $orgId, uid_expr: "auth.token.sub" })
      @check(expr: "this != null", message: "Brak dostępu do tej organizacji.") {
        role @check(expr: "this in ['ADMIN','MANAGER']", message: "Brak uprawnień do dodawania pracowników.")
      }
  }

  worker_insert(data: {
    orgId: $orgId
    login: $login
    fullName: $fullName
    loginEmail: $loginEmail
    role: $role
    active: $active
    email: $email
    phone: $phone
    workerType: $workerType
    workerId: $workerId
    createdAt_expr: "request.time"
    updatedAt_expr: "request.time"
  })
}

