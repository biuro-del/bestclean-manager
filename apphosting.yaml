env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
  - variable: APP_TARGET
    value: portal
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_GOOGLE_MAPS_API_KEY
    secret: GOOGLE_MAPS_API_KEY
    availability:
      - BUILD
  - variable: VITE_ENABLE_JOB_CARD_PREVIEW
    value: "1"
    availability:
      - BUILD
  - variable: API_PROXY_TARGET
    value: https://cleanzi-01.web.app
    availability:
      - RUNTIME
  - variable: API_PROXY_FORWARDED_HOST
    value: cleanzi-01.web.app
    availability:
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    value: iclean-room
    availability:
      - RUNTIME
  - variable: CLOUD_SQL_CONNECTION_NAME
    value: iclean-room:europe-west3:iclean-room-instance
    availability:
      - RUNTIME
  - variable: DB_CONNECTOR
    value: cloudsql
    availability:
      - RUNTIME
  - variable: CLOUD_SQL_AUTH_CLIENT
    value: compute
    availability:
      - RUNTIME
  - variable: CLOUD_SQL_AUTH_TYPE
    value: PASSWORD
    availability:
      - RUNTIME
  - variable: DB_NAME
    value: iclean-room-database
    availability:
      - RUNTIME
  - variable: DB_USER
    secret: PORTAL_DB_USER
    availability:
      - RUNTIME
  - variable: DB_PASS
    secret: PORTAL_DB_PASS
    availability:
      - RUNTIME
  - variable: DB_SSL_REJECT_UNAUTHORIZED
    value: "true"
    availability:
      - RUNTIME
  - variable: ADMIN_USERS_MODE
    value: direct
    availability:
      - RUNTIME
  - variable: PORTAL_DB_ROUTES_MODE
    value: direct
    availability:
      - RUNTIME
  - variable: PORTAL_SCHEDULE_ORDERS_MODE
    value: direct
    availability:
      - RUNTIME
  - variable: PORTAL_TASKS_MODE
    value: direct
    availability:
      - RUNTIME
  - variable: WORKER_PROFILE_MODE
    value: direct
    availability:
      - RUNTIME
  - variable: WORKER_PROFILE_STORAGE_MODE
    value: database
    availability:
      - RUNTIME
  - variable: MOBILE_SERVICE_EXECUTION_CORRELATION_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: MOBILE_SERVICE_EXECUTION_CORRELATION_CANARY_WORKER_IDS
    value: "W001"
    availability:
      - RUNTIME
