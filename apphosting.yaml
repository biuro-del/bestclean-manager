env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
  - variable: APP_TARGET
    value: portal
    availability:
      - BUILD
      - RUNTIME
  - variable: API_PROXY_TARGET
    value: https://europe-central2-iclean-room.cloudfunctions.net
    availability:
      - RUNTIME
  - variable: API_PROXY_FORWARDED_HOST
    value: iclean-room.web.app
    availability:
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    value: iclean-room
    availability:
      - RUNTIME
  - variable: CLOUD_SQL_CONNECTION_NAME
    value: iclean-room:europe-west3:iclean-room-instance
    availability:
      - RUNTIME
  - variable: DB_CONNECTOR
    value: cloudsql
    availability:
      - RUNTIME
  - variable: CLOUD_SQL_AUTH_CLIENT
    value: compute
    availability:
      - RUNTIME
  - variable: CLOUD_SQL_AUTH_TYPE
    value: PASSWORD
    availability:
      - RUNTIME
  - variable: DB_NAME
    value: iclean-room-database
    availability:
      - RUNTIME
  - variable: DB_USER
    secret: PORTAL_DB_USER
    availability:
      - RUNTIME
  - variable: DB_PASS
    secret: PORTAL_DB_PASS
    availability:
      - RUNTIME
  - variable: DB_SSL_REJECT_UNAUTHORIZED
    value: "true"
    availability:
      - RUNTIME
