env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
  - variable: APP_TARGET
    value: portal
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_GOOGLE_MAPS_API_KEY
    secret: GOOGLE_MAPS_API_KEY
    availability:
      - BUILD
  - variable: VITE_ENABLE_JOB_CARD_PREVIEW
    value: "1"
    availability:
      - BUILD
  - variable: VITE_REGISTRATION_API_BASE_URL
    value: https://registration-cleanzi.web.app
    availability:
      - BUILD
  - variable: VITE_REGISTRATION_PAGE_URL
    value: https://registration-cleanzi.web.app/rejestracja/
    availability:
      - BUILD
  # Public build inputs for the central Firebase registration issuer. Runtime
  # registration flags remain fail-closed below until the controlled smoke test.
  - variable: VITE_FIREBASE_APPCHECK_SITE_KEY
    value: "6Le-l5MtAAAAAEavTh3EWw5NOW0VPOH7sqtpUthk"
    availability:
      - BUILD
  - variable: VITE_CENTRAL_REGISTRATION_GOOGLE_CLIENT_ID
    value: "1080573912983-n4lpp41j8s7iff16s2ddadjvdjss3t95.apps.googleusercontent.com"
    availability:
      - BUILD
  - variable: VITE_CENTRAL_REGISTRATION_ISSUER_READY
    value: "true"
    availability:
      - BUILD
  # Enabled only after the central gate, Firebase Auth and App Check preflight
  # for portal.cleanzi.pl completed successfully.
  - variable: CLEANING_COMPANY_ONBOARDING_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: CLEANING_COMPANY_ONBOARDING_AUTO_CONFIRMATION_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: CLEANING_COMPANY_ONBOARDING_REQUIRE_APP_CHECK
    value: "true"
    availability:
      - RUNTIME
  # Facility-manager self-registration is a separate, Google-only channel.
  # The HMAC key remains server-side; App Check is required for every request.
  - variable: FACILITY_MANAGER_REGISTRATION_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: FACILITY_MANAGER_REGISTRATION_HMAC_SECRET
    secret: FACILITY_MANAGER_REGISTRATION_HMAC_SECRET
    availability:
      - RUNTIME
  - variable: FACILITY_MANAGER_REGISTRATION_APP_CHECK_APP_IDS
    value: "1:1080573912983:web:d64286e3776c009788c6d2"
    availability:
      - RUNTIME
  # Abuse counters share the named production database used by the central
  # registration gate. Never silently fall back to the default database.
  - variable: PORTAL_FIRESTORE_DATABASE_ID
    value: cleanzi-portal-eu
    availability:
      - RUNTIME
  - variable: FACILITY_MANAGER_REGISTRATION_ABUSE_COLLECTION
    value: "cleanziFacilityManagerRegistrationAbuseCounters"
    availability:
      - RUNTIME
  - variable: FACILITY_MANAGER_REGISTRATION_RATE_WINDOW_MS
    value: "900000"
    availability:
      - RUNTIME
  - variable: FACILITY_MANAGER_REGISTRATION_RATE_MAX_ATTEMPTS
    value: "5"
    availability:
      - RUNTIME
  # Firebase Web App identifiers and Data Connect topology are public client
  # configuration. Keep them as values instead of unresolved secret refs.
  - variable: VITE_FIREBASE_API_KEY
    value: "AIzaSyCdRVjbPWm6MueCHOwsmmbdkEKZoO6Dy-k"
    availability:
      - BUILD
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: "iclean-room.firebaseapp.com"
    availability:
      - BUILD
  - variable: VITE_FIREBASE_PROJECT_ID
    value: "iclean-room"
    availability:
      - BUILD
  - variable: VITE_FIREBASE_APP_ID
    value: "1:1080573912983:web:d64286e3776c009788c6d2"
    availability:
      - BUILD
  - variable: VITE_DATACONNECT_LOCATION
    value: "europe-west3"
    availability:
      - BUILD
  - variable: VITE_DATACONNECT_SERVICE
    value: "iclean-room-service"
    availability:
      - BUILD
  - variable: VITE_DATACONNECT_CONNECTOR
    value: "example"
    availability:
      - BUILD
  # Independent Grafik is present in the canary build, but the portal still
  # requires the session capability masked by the backend organization allowlist.
  - variable: VITE_WORKFORCE_SCHEDULE_MODE
    value: live
    availability:
      - BUILD
  - variable: FIREBASE_DATACONNECT_LOCATION
    value: "europe-west3"
    availability:
      - RUNTIME
  - variable: FIREBASE_DATACONNECT_SERVICE
    value: "iclean-room-service"
    availability:
      - RUNTIME
  - variable: FIREBASE_DATACONNECT_CONNECTOR
    value: "example"
    availability:
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    value: iclean-room
    availability:
      - RUNTIME
  - variable: BILLING_PROVIDER
    value: NONE
    availability:
      - RUNTIME
  - variable: TENANT_EMAIL_VERIFICATION_REQUIRED_FROM
    value: "2026-08-01T00:00:00.000Z"
    availability:
      - RUNTIME
  # Stripe remains disabled by BILLING_PROVIDER=NONE. GUS and Stripe secret
  # references must be added only after their complete production setup exists.
  - variable: CLOUD_SQL_CONNECTION_NAME
    value: iclean-room:europe-west3:iclean-room-instance
    availability:
      - RUNTIME
  - variable: DB_CONNECTOR
    value: cloudsql
    availability:
      - RUNTIME
  - variable: CLOUD_SQL_AUTH_CLIENT
    value: compute
    availability:
      - RUNTIME
  - variable: CLOUD_SQL_AUTH_TYPE
    value: PASSWORD
    availability:
      - RUNTIME
  - variable: DB_NAME
    value: iclean-room-database
    availability:
      - RUNTIME
  # Dedicated Grafik credentials are isolated from the legacy portal pool.
  # Both the backend and frontend canary remain limited to one organization.
  # Delivery stays internal-only; notifications and downstream effects stay off.
  - variable: WORKFORCE_SCHEDULE_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: WORKFORCE_SCHEDULE_ROLLOUT_MODE
    value: "CANARY"
    availability:
      - RUNTIME
  - variable: WORKFORCE_SCHEDULE_ALLOWED_ORG_IDS
    value: bestclean
    availability:
      - RUNTIME
  - variable: WORKFORCE_SCHEDULE_DELIVERY_ENABLED
    value: "false"
    availability:
      - RUNTIME
  - variable: WORKFORCE_SCHEDULE_NOTIFICATIONS_ENABLED
    value: "false"
    availability:
      - RUNTIME
  - variable: WORKFORCE_SCHEDULE_DOWNSTREAM_ENABLED
    value: "false"
    availability:
      - RUNTIME
  - variable: WORKFORCE_SCHEDULE_DB_CONNECTOR
    value: cloudsql
    availability:
      - RUNTIME
  - variable: WORKFORCE_SCHEDULE_DB_AUTH_TYPE
    value: PASSWORD
    availability:
      - RUNTIME
  - variable: WORKFORCE_SCHEDULE_DB_NAME
    value: iclean-room-database
    availability:
      - RUNTIME
  - variable: WORKFORCE_SCHEDULE_DB_USER
    secret: WORKFORCE_SCHEDULE_DB_USER
    availability:
      - RUNTIME
  - variable: WORKFORCE_SCHEDULE_DB_PASS
    secret: WORKFORCE_SCHEDULE_DB_PASS
    availability:
      - RUNTIME
  - variable: DB_USER
    secret: PORTAL_DB_USER
    availability:
      - RUNTIME
  - variable: DB_PASS
    secret: PORTAL_DB_PASS
    availability:
      - RUNTIME
  - variable: DB_SSL_REJECT_UNAUTHORIZED
    value: "true"
    availability:
      - RUNTIME
  - variable: ADMIN_USERS_MODE
    value: direct
    availability:
      - RUNTIME
  - variable: PORTAL_DB_ROUTES_MODE
    value: direct
    availability:
      - RUNTIME
  - variable: PORTAL_SCHEDULE_ORDERS_MODE
    value: direct
    availability:
      - RUNTIME
  - variable: PORTAL_TASKS_MODE
    value: direct
    availability:
      - RUNTIME
  - variable: WORKER_PROFILE_MODE
    value: direct
    availability:
      - RUNTIME
  - variable: WORKER_PROFILE_STORAGE_MODE
    value: database
    availability:
      - RUNTIME
  # Runtime synchronization starts only after the existing Firebase users are
  # backfilled. Phone sign-in remains independently gated until native APK E2E.
  - variable: WORKER_FIREBASE_PHONE_IDENTITY_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: MOBILE_SERVICE_EXECUTION_CORRELATION_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: MOBILE_SERVICE_EXECUTION_CORRELATION_CANARY_WORKER_IDS
    value: "W001,W005"
    availability:
      - RUNTIME
  - variable: MOBILE_REQUIRED_ZONE_VISITS_MODE
    value: "OFF"
    availability:
      - RUNTIME
