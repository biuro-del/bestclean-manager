<h1 class="welcome">Audyty</h1>
<p class="subwelcome">Wyniki sprzątania obiektów. Moduł w przygotowaniu (lista chwilowo pusta).</p>

<div class="events-table" aria-label="Tabela audytów">
  <div class="events-head">
    <div>Pracownik</div>
    <div>Klient</div>
    <div>Strefa</div>
    <div>Lokalizacja</div>
    <div>Data</div>
    <div>Start</div>
    <div>Stop</div>
    <div>Czas</div>
    <div>Status</div>
    <div>Edytował</div>
    <div></div>
  </div>

  <div id="auRows"></div>

  <div class="pager">
    <div class="pager-left">
      <span class="pager-label" id="auPageLabel">Strona 1 / 1</span>
      <span id="auShownLabel">Wyświetlono: -</span>
    </div>
    <div class="pager-right">
      <button class="btn2 pager-btn" id="auPrevBtn" type="button"><-</button>
      <button class="btn2 pager-btn" id="auNextBtn" type="button">-></button>
    </div>
  </div>
</div>
