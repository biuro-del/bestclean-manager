<div class="kanban-page">
  <div class="kanban-topbar">
    <label class="kanban-search">
      <span class="kanban-search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
        </svg>
      </span>
      <input id="kanbanSearch" type="search" placeholder="Szukaj zadania, osoby lub obiektu" autocomplete="off" />
    </label>
    <div class="kanban-actions" aria-label="Akcje kanban">
      <button class="kanban-icon-btn" type="button" title="Widok tablicy" aria-label="Widok tablicy">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4 5h5v14H4zM10.5 5h5v14h-5zM17 5h3v14h-3z" stroke="currentColor" stroke-linejoin="round" stroke-width="1.8" />
        </svg>
      </button>
      <button class="kanban-icon-btn" type="button" title="Ważne zadania" aria-label="Ważne zadania">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 5v8" stroke="currentColor" stroke-linecap="round" stroke-width="2.2" />
          <path d="M12 18h.01" stroke="currentColor" stroke-linecap="round" stroke-width="3" />
        </svg>
      </button>
      <button class="btn2 primary" id="kanbanAddTaskBtn" type="button">Dodaj zadanie</button>
    </div>
  </div>

  <div class="kanban-board-wrap">
    <div class="kanban-board" id="kanbanBoard" aria-live="polite"></div>
  </div>

  <div class="kanban-column-overlay" id="kanbanColumnOverlay" aria-hidden="true" hidden>
    <div class="kanban-column-modal" role="dialog" aria-modal="true" aria-labelledby="kanbanColumnModalTitle">
      <div class="kanban-column-modal-head">
        <div>
          <p>Zarządzanie tablicą</p>
          <h2 id="kanbanColumnModalTitle">Nowa kolumna</h2>
        </div>
        <button class="kanban-column-close" id="kanbanColumnCloseBtn" type="button" aria-label="Zamknij">×</button>
      </div>
      <div class="kanban-column-form">
        <label>
          <span>Nazwa kolumny</span>
          <input id="kanbanColumnName" type="text" maxlength="40" placeholder="Np. Do wykonania" autocomplete="off" />
        </label>
        <label>
          <span>Kolor</span>
          <select id="kanbanColumnColor"></select>
        </label>
        <div class="kanban-column-scope-field">
          <span>Typ kolumny</span>
          <select id="kanbanColumnScope" hidden aria-hidden="true"></select>
          <div class="kanban-scope-options" id="kanbanColumnScopeChoices" role="radiogroup" aria-label="Typ kolumny">
            <label>
              <input type="radio" name="kanbanColumnScopeChoice" value="global" />
              <span>Ogólna</span>
            </label>
            <label>
              <input type="radio" name="kanbanColumnScopeChoice" value="user" />
              <span>Użytkownik</span>
            </label>
            <label>
              <input type="radio" name="kanbanColumnScopeChoice" value="project" />
              <span>Inny projekt</span>
            </label>
            <label>
              <input type="radio" name="kanbanColumnScopeChoice" value="object" />
              <span>Obiekt</span>
            </label>
          </div>
        </div>
        <label id="kanbanColumnOwnerWrap" hidden>
          <span id="kanbanColumnOwnerLabel">Przypisanie</span>
          <input id="kanbanColumnOwner" type="text" list="kanbanColumnOwnerOptions" placeholder="Wpisz lub wybierz..." autocomplete="off" />
          <datalist id="kanbanColumnOwnerOptions"></datalist>
        </label>
        <p class="kanban-column-delete-info" id="kanbanColumnDeleteInfo"></p>
      </div>
      <div class="kanban-column-modal-actions">
        <button class="btn2 danger" id="kanbanColumnDeleteBtn" type="button" hidden>Usuń kolumnę</button>
        <span></span>
        <button class="btn2" id="kanbanColumnCancelBtn" type="button">Anuluj</button>
        <button class="btn2 primary" id="kanbanColumnSaveBtn" type="button">Dodaj kolumnę</button>
      </div>
    </div>
  </div>
</div>
